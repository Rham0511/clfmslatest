<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit &amp; History | ComLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/sidebar.css?v=91">
  <link rel="stylesheet" href="/css/faculty-portal.css?v=5">
  <link rel="stylesheet" href="/css/system-layout.css?v=8">
  <link rel="stylesheet" href="/css/table-readability.css?v=1">
  <style>
    .audit-page-content {
      --audit-table-header-bg: rgba(16, 56, 37, .72);
      --audit-table-header-text: #a7f3d0;
      --audit-table-border: rgba(74, 222, 128, .18);
      --audit-table-cell-text: #e2e8f0;
      --audit-table-row-bg: rgba(8, 31, 21, .3);
      --audit-table-row-alt-bg: rgba(16, 56, 37, .22);
      --audit-table-row-hover-bg: rgba(34, 197, 94, .055);
      box-sizing: border-box;
      width: calc(100% - var(--sidebar-width, 280px));
      min-width: 0;
      margin-left: var(--sidebar-width, 280px);
      height: 100vh;
      overflow: hidden;
      padding: 1rem 1.125rem 1.25rem;
    }

    body.faculty-page-heading-page.system-layout-page .audit-page-content {
      padding: 1rem 1.125rem 1.25rem !important;
    }

    body.faculty-page-heading-page.system-layout-page .audit-page-content > main {
      display: flex;
      height: calc(100vh - 3.25rem);
      min-height: 0;
      flex-direction: column;
      gap: .8rem;
      padding: 0 !important;
    }

    body.faculty-page-heading-page.system-layout-page .audit-page-content .system-dashboard-heading {
      margin-bottom: 0;
    }

    .audit-intro {
      border-radius: .75rem;
      padding: .8rem .9rem;
    }

    .audit-filter-layout {
      display: grid;
      grid-template-columns: minmax(11rem, .7fr) minmax(0, 2.3fr);
      align-items: center;
      gap: .9rem;
    }

    .audit-filter-heading {
      min-width: 0;
    }

    .audit-filter-heading p {
      margin: 0;
      font-size: .8rem;
      line-height: 1.5;
    }

    .audit-filter-controls {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(9rem, 1fr) minmax(11rem, 1.2fr) repeat(2, minmax(7.5rem, .8fr));
      align-items: end;
      gap: .55rem;
    }

    .audit-filter-controls.has-action {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .audit-filter-control {
      display: grid;
      min-width: 0;
      gap: .25rem;
    }

    .audit-filter-control.hidden {
      display: none;
    }

    .audit-filter-control label {
      margin: 0;
      color: #b7d8c6;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .025em;
    }

    .audit-filter-control :is(input, select) {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 2.5rem;
      border: 1px solid rgba(74, 222, 128, .22);
      border-radius: .6rem;
      background: rgba(2, 20, 13, .72);
      padding: .45rem .65rem;
      color: #e6f5ec;
      font: inherit;
      font-size: .78rem;
      line-height: 1.25;
    }

    .audit-filter-control :is(input, select):focus-visible {
      border-color: #34d399;
      outline: 3px solid rgba(52, 211, 153, .2);
      outline-offset: 1px;
    }

    .audit-search-field {
      position: relative;
    }

    .audit-search-field > i {
      position: absolute;
      top: 50%;
      left: .75rem;
      color: #75b992;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .audit-search-field input {
      padding-left: 2.15rem;
    }

    .audit-history-panel {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
      border-radius: .75rem;
    }

    #auditHistoryList {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      padding: .6rem;
      scrollbar-color: rgba(74, 222, 128, .55) rgba(7, 17, 31, .8);
      scrollbar-width: thin;
    }

    #auditHistoryList::-webkit-scrollbar {
      width: .65rem;
    }

    #auditHistoryList::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(7, 17, 31, .8);
    }

    #auditHistoryList::-webkit-scrollbar-thumb {
      border: 2px solid rgba(7, 17, 31, .8);
      border-radius: 999px;
      background: rgba(74, 222, 128, .45);
    }

    #auditHistoryList::-webkit-scrollbar-thumb:hover {
      background: rgba(74, 222, 128, .72);
    }

    .audit-summary-card {
      display: grid;
      min-width: 0;
      min-height: 3.5rem;
      grid-template-columns: 2.25rem minmax(0, 1fr);
      align-items: center;
      gap: .6rem;
      border: 1px solid rgba(74, 222, 128, .14);
      border-radius: .7rem;
      background: linear-gradient(145deg, rgba(16, 56, 37, .5), rgba(2, 20, 13, .38));
      padding: .55rem .7rem;
    }

    .audit-summary-icon {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      place-items: center;
      border: 1px solid rgba(74, 222, 128, .2);
      border-radius: .65rem;
      background: rgba(34, 197, 94, .1);
      color: #86efac;
    }

    .audit-summary-label,
    .audit-summary-value {
      margin: 0;
    }

    .audit-summary-label {
      color: #9dc6ac;
      font-size: .68rem;
      font-weight: 750;
      letter-spacing: .12em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .audit-summary-value {
      margin-top: .15rem;
      overflow: hidden;
      color: #e6f5ec;
      font-size: .92rem;
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .audit-empty-state {
      display: grid;
      min-height: clamp(16rem, 38vh, 27rem);
      align-content: center;
      justify-items: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      text-align: center;
    }

    .audit-empty-icon {
      display: grid;
      width: 4rem;
      height: 4rem;
      place-items: center;
      border: 1px solid rgba(74, 222, 128, .2);
      border-radius: 1.25rem;
      background: linear-gradient(145deg, rgba(34, 197, 94, .15), rgba(6, 78, 59, .16));
      color: #86efac;
      font-size: 1.35rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
    }

    .audit-empty-state h3 {
      margin-top: 1.15rem;
      color: #f0fdf4;
      font-size: 1.15rem;
      font-weight: 750;
    }

    .audit-empty-state p {
      max-width: 34rem;
      margin-top: .45rem;
      color: #a7b8ae;
      font-size: .9rem;
      line-height: 1.65;
    }

    .audit-table-wrap {
      max-width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-color: rgba(74, 222, 128, .45) rgba(7, 17, 31, .8);
      scrollbar-width: thin;
    }

    .audit-table {
      width: 100%;
      min-width: 52rem;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .audit-table th:nth-child(1) { width: 29%; }
    .audit-table th:nth-child(2) { width: 22%; }
    .audit-table th:nth-child(3) { width: 26%; }
    .audit-table th:nth-child(4) { width: 23%; }

    body.app-shell.faculty-page .audit-page-content .audit-table th {
      padding: .65rem .85rem !important;
      border-bottom: 1px solid var(--audit-table-border) !important;
      background: var(--audit-table-header-bg) !important;
      color: var(--audit-table-header-text) !important;
      font-size: .72rem !important;
      font-weight: 800 !important;
      letter-spacing: .075em !important;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    body.app-shell.faculty-page .audit-page-content .audit-table tbody td {
      padding: .65rem .85rem !important;
      border-top: 1px solid var(--audit-table-border) !important;
      color: var(--audit-table-cell-text) !important;
      font-size: .88rem !important;
      line-height: 1.4 !important;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    .audit-table td p.font-semibold {
      font-size: .92rem;
      line-height: 1.4;
    }

    .audit-table td p.text-xs {
      font-size: .88rem;
      line-height: 1.45;
    }

    .audit-table td.whitespace-nowrap {
      font-size: .88rem;
    }

    .audit-table td span {
      font-size: .8rem;
    }

    body.app-shell.faculty-page .audit-page-content .audit-table tbody tr {
      background: var(--audit-table-row-bg) !important;
      transition: background-color .16s ease;
    }

    body.app-shell.faculty-page .audit-page-content .audit-table tbody tr:nth-child(even) {
      background: var(--audit-table-row-alt-bg) !important;
    }

    body.app-shell.faculty-page .audit-page-content .audit-table tbody tr:hover {
      background: var(--audit-table-row-hover-bg) !important;
    }

    .audit-status-badge {
      display: inline-flex;
      max-width: 100%;
      align-items: center;
      border: 1px solid rgba(74, 222, 128, .24);
      border-radius: 999px;
      background: rgba(34, 197, 94, .1);
      padding: .3rem .65rem;
      color: #a7f3d0;
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    body.app-shell.faculty-page .audit-page-content .audit-status-badge {
      font-size: .78rem !important;
      font-weight: 700 !important;
    }

    .audit-status-badge--pending {
      border-color: rgba(251, 191, 36, .34);
      background: rgba(245, 158, 11, .13);
      color: #fcd34d;
    }

    .audit-status-badge--approved,
    .audit-status-badge--returned {
      border-color: rgba(74, 222, 128, .3);
      background: rgba(34, 197, 94, .13);
      color: #86efac;
    }

    .audit-status-badge--rejected {
      border-color: rgba(251, 113, 133, .32);
      background: rgba(244, 63, 94, .12);
      color: #fda4af;
    }

    .audit-details-button {
      display: inline-flex;
      min-width: 2.35rem;
      min-height: 2.35rem;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      border: 1px solid rgba(74, 222, 128, .25);
      border-radius: .75rem;
      background: rgba(16, 56, 37, .55);
      color: #a7f3d0;
      font-size: .85rem;
      font-weight: 700;
      transition: background-color .15s ease, border-color .15s ease;
    }

    body.app-shell.faculty-page .audit-page-content .audit-details-button {
      min-width: 2rem !important;
      min-height: 1.9rem !important;
      padding: .2rem .5rem !important;
      font-size: .75rem !important;
    }

    .audit-details-button:hover,
    .audit-details-button:focus-visible,
    .audit-details-button[aria-expanded="true"] {
      border-color: rgba(74, 222, 128, .65);
      background: rgba(16, 97, 58, .8);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, .12);
      outline: none;
    }

    .audit-details-overlay {
      position: fixed;
      z-index: 2200;
      inset: 0;
      display: grid;
      overflow-y: auto;
      place-items: center;
      box-sizing: border-box;
      padding: max(1rem, env(safe-area-inset-top, 0px))
        max(1rem, env(safe-area-inset-right, 0px))
        max(1rem, env(safe-area-inset-bottom, 0px))
        max(1rem, env(safe-area-inset-left, 0px));
      background: rgba(2, 10, 6, .54);
      backdrop-filter: blur(2px);
    }

    .audit-details-overlay[hidden] {
      display: none;
    }

    body.audit-details-open {
      overflow: hidden;
    }

    .audit-details-popover {
      position: relative;
      box-sizing: border-box;
      width: min(30rem, 100%);
      max-height: min(34rem, calc(100vh - 2rem));
      max-height: min(34rem, calc(100dvh - 2rem));
      overflow: auto;
      border: 1px solid rgba(74, 222, 128, .32);
      border-radius: 1rem;
      background: #07180f !important;
      opacity: 1 !important;
      padding: 1.1rem;
      color: #d1fae5;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .48);
      overflow-wrap: anywhere;
      font-size: .9rem;
      line-height: 1.6;
    }

    .audit-details-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .75rem;
    }

    .audit-details-popover strong {
      display: block;
      color: #a7f3d0;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .audit-details-content {
      white-space: pre-line;
    }

    .audit-details-close {
      display: inline-flex;
      width: 2.25rem;
      min-width: 2.25rem;
      height: 2.25rem;
      min-height: 2.25rem;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(74, 222, 128, .25);
      border-radius: .65rem;
      background: rgba(2, 6, 23, .42);
      color: #d1fae5;
      cursor: pointer;
    }

    .audit-details-close:focus-visible {
      outline: 3px solid rgba(52, 211, 153, .55);
      outline-offset: 2px;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: .3rem;
      border-top: 1px solid rgba(74, 222, 128, .12);
      padding: .5rem .7rem;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination[hidden] {
      display: none;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination button {
      display: inline-flex;
      min-width: 2rem !important;
      min-height: 2rem !important;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      border: 1px solid rgba(74, 222, 128, .22);
      border-radius: .55rem;
      background: rgba(2, 6, 23, .55);
      padding: .3rem .55rem !important;
      color: #d1fae5;
      font-size: .78rem !important;
      font-weight: 700;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination button:hover:not(:disabled),
    body.app-shell.faculty-page .audit-page-content .audit-pagination button:focus-visible {
      border-color: rgba(74, 222, 128, .55);
      background: rgba(16, 97, 58, .55);
      outline: none;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination button[aria-current="page"] {
      border-color: #16a34a;
      background: #16a34a;
      color: #ffffff;
    }

    body.app-shell.faculty-page .audit-page-content .audit-pagination button:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    .audit-pagination-status {
      margin-right: auto;
      color: #9fb8a8;
      font-size: .8rem;
    }

    .audit-mobile-cards {
      display: none;
    }

    .audit-tabs {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      gap: .4rem;
    }

    body.app-shell.faculty-page .audit-page-content .audit-tab {
      position: relative;
      min-height: 2rem;
      border: 1px solid rgba(74, 222, 128, .24);
      border-radius: .55rem;
      background: rgba(2, 20, 13, .38);
      padding: .35rem .75rem !important;
      color: #cde8d7;
      font-size: .8rem !important;
      font-weight: 700;
      transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }

    body.app-shell.faculty-page .audit-page-content .audit-tab:hover {
      border-color: rgba(74, 222, 128, .55);
      background: rgba(34, 197, 94, .12);
      color: #f0fdf4;
    }

    body.app-shell.faculty-page .audit-page-content .audit-tab[aria-selected="true"] {
      border-color: #16a34a;
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(22, 163, 74, .22);
    }

    body.app-shell.faculty-page .audit-page-content .audit-tab:focus-visible {
      outline: 3px solid rgba(74, 222, 128, .35);
      outline-offset: 2px;
    }

    .audit-mobile-cards article {
      padding: 1rem;
    }

    .audit-mobile-cards h3 {
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .audit-mobile-cards time,
    .audit-mobile-cards p.text-xs,
    .audit-mobile-cards p.text-\[11px\] {
      font-size: .88rem;
      line-height: 1.5;
    }

    .audit-mobile-cards time {
      max-width: 42%;
      flex: 0 1 11rem;
      overflow-wrap: anywhere;
    }

    .audit-mobile-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-top: .85rem;
      border-top: 1px solid rgba(74, 222, 128, .1);
      padding-top: .75rem;
    }

    .audit-page-content.theme-light {
      --audit-table-header-bg: #0a2e1d;
      --audit-table-header-text: #ffffff;
      --audit-table-border: #e3ebe5;
      --audit-table-cell-text: #34483a;
      --audit-table-row-bg: #ffffff;
      --audit-table-row-alt-bg: #f6faf7;
      --audit-table-row-hover-bg: #edf6ef;
      --bg: #f4f7f5;
      --bg-secondary: #ffffff;
      --card-bg: #ffffff;
      --card-bg-solid: #ffffff;
      --card-hover: #eef6f0;
      --borders: #d7e3da;
      --text: #26352b;
      --text-secondary: #66756a;
      color-scheme: light;
      color: #26352b !important;
      background: #f4f7f5 !important;
    }

    .audit-page-content.theme-light .system-dashboard-heading {
      border-color: #d7e3da;
      background: #ffffff;
      color: #245c3a;
      box-shadow: 0 8px 24px rgba(31, 41, 55, .07);
    }

    .audit-page-content.theme-light .system-dashboard-heading h1 {
      color: #17452a;
    }

    .audit-page-content.theme-light .system-dashboard-heading #mobileMenuToggle {
      border-color: #c5dfcd;
      background: #edf6ef;
      color: #245c3a;
    }

    .audit-page-content .profile-theme-static {
      border-color: rgba(74, 222, 128, .2) !important;
      background: #04281b !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }

    .audit-page-content .profile-theme-static .system-profile-badge-name,
    .audit-page-content .profile-theme-static .system-profile-badge-copy {
      color: #ffffff !important;
    }

    .audit-page-content .profile-theme-static .system-profile-badge-role {
      color: #34d399 !important;
    }

    .audit-page-content .profile-theme-static .system-profile-badge-avatar {
      border-color: rgba(74, 222, 128, .32) !important;
      background: #06402b !important;
      color: #6ee7b7 !important;
    }

    .audit-page-content.theme-light .audit-intro,
    .audit-page-content.theme-light .audit-history-panel {
      border-color: #d7e3da !important;
      background: #ffffff !important;
      color: #26352b !important;
      box-shadow: 0 8px 24px rgba(31, 41, 55, .07) !important;
    }

    .audit-page-content.theme-light .audit-intro p,
    .audit-page-content.theme-light .audit-intro label {
      color: #34483a !important;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-tab {
      border-color: #cbd8ce;
      background: #f7faf8;
      color: #34483a;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-tab:hover {
      border-color: #83b995;
      background: #edf6ef;
      color: #14532d;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-tab[aria-selected="true"] {
      border-color: #16803c;
      background: #16803c;
      color: #ffffff;
    }

    .audit-page-content.theme-light .audit-filter-control :is(input, select) {
      border-color: #cbd8ce !important;
      background: #ffffff !important;
      background-color: #ffffff !important;
      color: #26352b !important;
    }

    .audit-page-content.theme-light .audit-filter-control select option {
      background: #ffffff !important;
      color: #26352b !important;
    }

    .audit-page-content.theme-light #auditSummary {
      border-color: #e3ebe5 !important;
    }

    .audit-page-content.theme-light .audit-summary-card,
    .audit-page-content.theme-light .audit-mobile-cards article {
      border-color: #d7e3da !important;
      background: #ffffff !important;
      color: #26352b !important;
      box-shadow: 0 4px 14px rgba(31, 41, 55, .05);
    }

    .audit-page-content.theme-light .audit-summary-icon {
      border-color: #cfe4d5;
      background: #eaf5ee;
      color: #16834a;
    }

    .audit-page-content.theme-light .audit-summary-label {
      color: #54715d;
    }

    .audit-page-content.theme-light .audit-summary-value,
    .audit-page-content.theme-light .audit-mobile-cards :is(h3, p, time) {
      color: #34483a !important;
    }

    .audit-page-content.theme-light .audit-table-wrap {
      border-color: #d7e3da !important;
      background: #ffffff !important;

    .audit-page-content.theme-light .audit-table td :is(p, span):not(.audit-status-badge) {

    .audit-page-content.theme-light .audit-table tbody tr:hover td {

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-status-badge--approved,

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-details-button:hover,
    body.app-shell.faculty-page .audit-page-content.theme-light .audit-details-button:focus-visible,
    body.app-shell.faculty-page .audit-page-content.theme-light .audit-details-button[aria-expanded="true"] {

    .audit-page-content.theme-light .audit-empty-state h3 {

    }

    .audit-page-content.theme-light .audit-empty-state p {

    }

    .audit-page-content.theme-light .audit-empty-icon {
      border-color: #c5dfcd;
      background: #edf6ef;
      color: #247044;
      box-shadow: 0 8px 20px rgba(31, 41, 55, .06);
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination {
      border-color: #e3ebe5;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination button {
      border-color: #cbd8ce;
      background: #ffffff;
      color: #245c3a;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination button:hover:not(:disabled),
    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination button:focus-visible {
      border-color: #83b995;
      background: #edf6ef;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination button[aria-current="page"] {
      border-color: #166534;
      background: #166534;
      color: #ffffff;
    }

    body.app-shell.faculty-page .audit-page-content.theme-light .audit-pagination-status {
      color: #66756a;
    }

    .audit-details-popover.theme-light {
      border-color: #cbd8ce;
      background: #ffffff !important;
      color: #34483a;
      box-shadow: 0 18px 48px rgba(31, 41, 55, .2);
    }

    .audit-details-popover.theme-light strong {
      color: #245c3a;
    }

    .audit-details-popover.theme-light .audit-details-close {
      border-color: #cbd8ce;
      background: #f3f7f4;
      color: #34483a;
    }

    @media (max-width: 639px) {
      .audit-pagination {
        justify-content: center;
        gap: .3rem;
        padding: .6rem .4rem;
      }

      .audit-pagination-status {
        width: 100%;
        margin: 0 0 .25rem;
        text-align: center;
      }
    }

    @media (max-width: 1199px) {
      .audit-filter-layout {
        grid-template-columns: minmax(0, 1fr);

    @media (max-width: 1023px) {

      body.faculty-page-heading-page.system-layout-page .audit-page-content {

      body.faculty-page-heading-page.system-layout-page .audit-page-content > main {

    @media (max-width: 767px) {
      body.faculty-page-heading-page.system-layout-page .audit-page-content {

      .audit-page-content main {

      .audit-filter-controls,

    @media (min-width: 768px) {
      body.app-shell.faculty-page .audit-page-content .audit-pagination {
        padding-right: 7.5rem;
      }
    }

    body.app-shell.faculty-page #qr-scan-float-btn,
    body.app-shell.faculty-page #comlab-help-float-btn {
      width: 2.75rem !important;
      min-width: 2.75rem !important;
      height: 2.75rem !important;

      right: max(1rem, env(safe-area-inset-right, 0px)) !important;

<body class="app-shell student-portal faculty-page faculty-page-heading-page system-layout-page">
  <script>window.__CURRENT_USER__ = __CURRENT_USER_JSON__;</script>
  <div id="shared-sidebar"></div>

  <div class="audit-page-content min-h-screen">
    <main class="mx-auto w-full max-w-[1600px]">
      <div class="system-dashboard-heading">
        <div class="system-dashboard-heading-main">
          <button id="mobileMenuToggle" class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
        </div>
        <div class="system-dashboard-heading-actions">
          <a class="faculty-profile-link" href="/faculty-profile" aria-label="Open my profile">
          <div class="student-page-user system-profile-badge">
            <span class="system-profile-badge-avatar" data-user-initials>FC</span>
            <span class="system-profile-badge-copy">
              <span class="system-profile-badge-name" data-user-name>Faculty</span>
              <span class="system-profile-badge-role" data-user-role>Faculty</span>
            </span>
          </div>
          </a>
        </div>
      </div>
      <div class="audit-tabs" role="tablist" aria-label="Faculty audit history">
        <button id="facultyActivityTab" type="button" class="audit-tab" role="tab" aria-selected="true">Account activity</button>
      </div>

      <section class="audit-intro rounded-2xl border border-emerald-400/15 bg-[#07111f]/95 shadow-2xl shadow-black/20">
        <div class="audit-filter-layout">
          <div class="audit-filter-heading">
            <p id="facultyAuditIntroTitle" class="font-bold uppercase tracking-[.2em] text-emerald-300">Your account activity</p>
          </div>
          <div class="audit-filter-controls">
            <div class="audit-filter-control">
              <label for="auditViewType" class="font-semibold text-emerald-100/80">History type</label>
              <select id="auditViewType" class="w-full rounded-lg border border-emerald-400/20 bg-[#020617] px-3 text-sm text-white">
                <option value="borrow">Borrow history</option>
                <option value="assignment">Equipment assignments</option>
                <option value="attendance">Student attendance</option>
                <option value="scan">Equipment scan history</option>
              </select>
            </div>
            <div class="audit-filter-control">
              <label for="auditSearch">Search records</label>
              <div class="audit-search-field">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <input id="auditSearch" type="search" autocomplete="off" placeholder="Equipment, user, or activity">
              </div>
            </div>
            <div class="audit-filter-control">
              <label for="auditDateFrom">From</label>
              <input id="auditDateFrom" type="date">
            </div>
            <div class="audit-filter-control">
              <label for="auditDateTo">To</label>
              <input id="auditDateTo" type="date">
            </div>
          </div>
        </div>
      </section>

      <section class="audit-history-panel overflow-hidden rounded-2xl border border-emerald-400/15 bg-[#07111f]/95 shadow-2xl shadow-black/20">
        <div id="auditSummary" class="hidden grid gap-2 border-b border-emerald-400/10 p-3 sm:grid-cols-3 sm:p-4"></div>
        <div id="auditHistoryList" aria-live="polite" class="p-3 sm:p-4">
          <p class="text-sm text-slate-400">Loading history…</p>
        </div>
        <nav id="auditPagination" class="audit-pagination" aria-label="History pagination" hidden></nav>
      </section>
    </main>
  </div>

  <script>
    const currentUser = window.__CURRENT_USER__ || {};
    const currentUserId = Number(currentUser.id || currentUser.userId || 0);
    const viewType = document.getElementById('auditViewType');
    const auditSearch = document.getElementById('auditSearch');
    const auditDateFrom = document.getElementById('auditDateFrom');
    const auditDateTo = document.getElementById('auditDateTo');
    const summary = document.getElementById('auditSummary');
    const historyList = document.getElementById('auditHistoryList');
    const pagination = document.getElementById('auditPagination');
    const auditDetailsOverlay = document.createElement('div');
    const auditDetailsPopover = document.createElement('section');
    const auditRowsPerPage = 7;
    let auditCurrentPage = 1;
    let auditPageCount = 1;
    let auditDetailsTrigger = null;
    let allAuditEntries = [];
    let currentAuditEntries = [];
    let currentAuditEmptyMessage = '';
    auditDetailsOverlay.className = 'audit-details-overlay';
    auditDetailsOverlay.hidden = true;
    auditDetailsPopover.className = 'audit-details-popover';
    auditDetailsPopover.id = 'auditDetailsPopover';
    auditDetailsPopover.setAttribute('role', 'dialog');
    auditDetailsPopover.setAttribute('aria-modal', 'true');
    auditDetailsPopover.setAttribute('aria-labelledby', 'auditDetailsHeading');
    auditDetailsPopover.setAttribute('tabindex', '-1');
    auditDetailsOverlay.append(auditDetailsPopover);
    document.body.append(auditDetailsOverlay);
    const requestedView = new URLSearchParams(window.location.search).get('view');
    if (['assignment', 'attendance'].includes(requestedView)) viewType.value = requestedView;
    const facultyActivityTab = document.getElementById('facultyActivityTab');
    const updateFacultyAuditTabs = () => {
      facultyActivityTab.setAttribute('aria-selected', 'true');
    };

    function formatAuditTimestamp(value) {
      if (!value) return 'Date not recorded';
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function setAuditMessage(message, isError = false) {
      summary.classList.add('hidden');
      summary.replaceChildren();
      allAuditEntries = [];
      currentAuditEntries = [];
      historyList.replaceChildren();
      pagination.hidden = true;
      pagination.replaceChildren();
      hideAuditDetails();
      const state = document.createElement('div');
      state.className = 'audit-empty-state';
      const icon = document.createElement('span');
      icon.className = `audit-empty-icon ${isError ? 'border-rose-400/20 bg-rose-950/30 text-rose-200' : ''}`;
      const iconElement = document.createElement('i');
      iconElement.className = isError ? 'fas fa-triangle-exclamation' : 'fas fa-spinner animate-spin';
      iconElement.setAttribute('aria-hidden', 'true');
      icon.append(iconElement);
      const title = document.createElement('h3');
      title.textContent = isError ? 'History could not be loaded' : 'Loading your history';
      const description = document.createElement('p');
      description.textContent = message;
      state.append(icon, title, description);
      historyList.append(state);
    }

    function renderEmptyState(message) {
      historyList.replaceChildren();
      pagination.hidden = true;
      pagination.replaceChildren();
      const state = document.createElement('div');
      state.className = 'audit-empty-state';
      const icon = document.createElement('span');
      icon.className = 'audit-empty-icon';
      const iconElement = document.createElement('i');
      iconElement.className = 'fas fa-clock-rotate-left';
      iconElement.setAttribute('aria-hidden', 'true');
      icon.append(iconElement);
      const title = document.createElement('h3');
      title.textContent = 'No activity yet';
      const description = document.createElement('p');
      description.textContent = message;
      state.append(icon, title, description);
      historyList.append(state);
    }

    function renderSummary(cards) {
      summary.replaceChildren();
      if (!cards.length) {
        summary.classList.add('hidden');
        return;
      }
      summary.classList.remove('hidden');
      const summaryIcons = {
        'Borrow events': 'fa-box-open',
        'Equipment activity': 'fa-qrcode',
        'Assignment events': 'fa-clipboard-check',
        'Attendance records': 'fa-user-check',
        'Latest item': 'fa-cube',
        'Latest activity': 'fa-clock-rotate-left',
        'Items involved': 'fa-boxes-stacked',
        'Present / Late': 'fa-user-check',
        'Absent': 'fa-user-xmark'
      };
      cards.forEach(({ label, value }) => {
        const card = document.createElement('div');
        card.className = 'audit-summary-card';
        const icon = document.createElement('span');
        icon.className = 'audit-summary-icon';
        const iconElement = document.createElement('i');
        iconElement.className = `fas ${summaryIcons[label] || 'fa-chart-simple'}`;
        iconElement.setAttribute('aria-hidden', 'true');
        icon.append(iconElement);
        const copy = document.createElement('div');
        copy.className = 'min-w-0';
        const labelElement = document.createElement('p');
        labelElement.className = 'audit-summary-label';
        labelElement.textContent = label;
        const valueElement = document.createElement('p');
        valueElement.className = 'audit-summary-value';
        valueElement.textContent = value || '—';
        copy.append(labelElement, valueElement);
        card.append(icon, copy);
        summary.append(card);
      });
    }

    function hideAuditDetails(restoreFocus = false) {
      if (auditDetailsOverlay.hidden) return;
      auditDetailsOverlay.hidden = true;
      document.body.classList.remove('audit-details-open');
      document.querySelectorAll('[data-audit-details][aria-expanded="true"]').forEach((button) => {
        button.setAttribute('aria-expanded', 'false');
      });
      const trigger = auditDetailsTrigger;
      auditDetailsTrigger = null;
      if (restoreFocus && trigger?.isConnected) trigger.focus();
    }

    function showAuditDetails(button) {
      auditDetailsTrigger = button;
      const heading = document.createElement('strong');
      heading.id = 'auditDetailsHeading';
      heading.textContent = 'Details';
      const headingRow = document.createElement('div');
      headingRow.className = 'audit-details-heading';
      const closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.className = 'audit-details-close';
      closeButton.setAttribute('aria-label', 'Close details');
      closeButton.innerHTML = '<i class="fas fa-xmark" aria-hidden="true"></i>';
      closeButton.addEventListener('click', () => hideAuditDetails(true));
      headingRow.append(heading, closeButton);
      const content = document.createElement('div');
      content.id = 'auditDetailsContent';
      content.className = 'audit-details-content';
      content.textContent = button.dataset.auditDetails || 'No additional details.';
      auditDetailsPopover.setAttribute('aria-describedby', content.id);
      auditDetailsPopover.replaceChildren(headingRow, content);
      const isLightTheme = document.querySelector('.audit-page-content')?.classList.contains('theme-light') || false;
      auditDetailsPopover.classList.toggle('theme-light', isLightTheme);
      auditDetailsOverlay.hidden = false;
      document.body.classList.add('audit-details-open');
      button.setAttribute('aria-expanded', 'true');
      closeButton.focus();
    }

    function createAuditDetailsButton(entry) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'audit-details-button';
      button.dataset.auditDetails = [
        entry.subtitle,
        entry.details,
        entry.isLastBorrower ? 'You were the last borrower.' : ''
      ].filter(Boolean).join('\n');
      button.setAttribute('aria-label', `Show details for ${entry.title || 'this history item'}`);
      button.setAttribute('aria-controls', auditDetailsPopover.id);
      button.setAttribute('aria-expanded', 'false');
      button.innerHTML = '<i class="fas fa-circle-info" aria-hidden="true"></i><span>Info</span>';
      return button;
    }

    function getAuditStatusClass(status) {
      const normalizedStatus = String(status || '').trim().toLowerCase();
      if (normalizedStatus.includes('pending')) return 'audit-status-badge--pending';
      if (normalizedStatus.includes('approved')) return 'audit-status-badge--approved';
      if (normalizedStatus.includes('rejected')) return 'audit-status-badge--rejected';
      if (normalizedStatus.includes('returned')) return 'audit-status-badge--returned';
      return '';
    }

    function renderAuditPagination(totalRecords) {
      auditPageCount = Math.max(1, Math.ceil(totalRecords / auditRowsPerPage));
      auditCurrentPage = Math.min(auditCurrentPage, auditPageCount);
      pagination.replaceChildren();
      pagination.hidden = auditPageCount <= 1;
      if (pagination.hidden) return;

      const status = document.createElement('span');
      status.className = 'audit-pagination-status';
      const start = (auditCurrentPage - 1) * auditRowsPerPage + 1;
      const end = Math.min(auditCurrentPage * auditRowsPerPage, totalRecords);
      status.textContent = `Showing ${start}–${end} of ${totalRecords}`;
      pagination.append(status);

      const previous = document.createElement('button');
      previous.type = 'button';
      previous.dataset.auditPageAction = 'previous';
      previous.setAttribute('aria-label', 'Previous page');
      previous.innerHTML = '<i class="fas fa-chevron-left" aria-hidden="true"></i><span>Previous</span>';
      previous.disabled = auditCurrentPage === 1;
      pagination.append(previous);

      const maxVisiblePages = 5;
      let firstPage = Math.max(1, auditCurrentPage - Math.floor(maxVisiblePages / 2));
      const lastPage = Math.min(auditPageCount, firstPage + maxVisiblePages - 1);
      firstPage = Math.max(1, lastPage - maxVisiblePages + 1);
      for (let page = firstPage; page <= lastPage; page += 1) {
        const pageButton = document.createElement('button');
        pageButton.type = 'button';
        pageButton.dataset.auditPage = String(page);
        pageButton.textContent = String(page);
        if (page === auditCurrentPage) {
          pageButton.setAttribute('aria-current', 'page');
          pageButton.setAttribute('aria-label', `Page ${page}, current page`);
        } else {
          pageButton.setAttribute('aria-label', `Page ${page}`);
        }
        pagination.append(pageButton);
      }

      const next = document.createElement('button');
      next.type = 'button';
      next.dataset.auditPageAction = 'next';
      next.setAttribute('aria-label', 'Next page');
      next.innerHTML = '<span>Next</span><i class="fas fa-chevron-right" aria-hidden="true"></i>';
      next.disabled = auditCurrentPage === auditPageCount;
      pagination.append(next);
    }

    function renderEntries(entries, emptyMessage) {
      allAuditEntries = entries;
      currentAuditEmptyMessage = emptyMessage;
      applyAuditFilters();
    }

    function getAuditCalendarDay(value) {
      const rawValue = String(value || '');
      if (/^\d{4}-\d{2}-\d{2}$/.test(rawValue)) return rawValue;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, '0'),
        String(date.getDate()).padStart(2, '0')
      ].join('-');
    }

    function applyAuditFilters() {
      const query = auditSearch.value.trim().toLocaleLowerCase();
      const fromDate = auditDateFrom.value;
      const toDate = auditDateTo.value;
      currentAuditEntries = allAuditEntries.filter((entry) => {
        const searchableText = [
          entry.title,
          entry.actor,
          entry.subtitle,
          entry.status,
          entry.details
        ].filter(Boolean).join(' ').toLocaleLowerCase();
        if (query && !searchableText.includes(query)) return false;
        if (fromDate || toDate) {
          const entryDay = getAuditCalendarDay(entry.time);
          if (!entryDay || (fromDate && entryDay < fromDate) || (toDate && entryDay > toDate)) {
            return false;
          }
        }
        return true;
      });
      auditCurrentPage = 1;
      hideAuditDetails();
      renderCurrentAuditPage();
    }

    function renderCurrentAuditPage() {
      const entries = currentAuditEntries;
      historyList.replaceChildren();
      if (!entries.length) {
        const hasFilters = Boolean(auditSearch.value.trim() || auditDateFrom.value || auditDateTo.value);
        const message = allAuditEntries.length && hasFilters
          ? 'No history records match your search and date range.'
          : currentAuditEmptyMessage;
        renderEmptyState(message);
        return;
      }
      const totalPages = Math.max(1, Math.ceil(entries.length / auditRowsPerPage));
      auditCurrentPage = Math.min(auditCurrentPage, totalPages);
      const startIndex = (auditCurrentPage - 1) * auditRowsPerPage;
      const rows = entries.slice(startIndex, startIndex + auditRowsPerPage);
      const tableWrap = document.createElement('div');
      tableWrap.className = 'audit-table-wrap hidden rounded-xl border border-emerald-400/10 bg-[#020617]/45 md:block';
      const table = document.createElement('table');
      table.className = 'audit-table';
      const head = document.createElement('thead');
      head.className = 'bg-emerald-400/[.04]';
      const headRow = document.createElement('tr');
      ['History / Item', 'User', 'Date & Time', 'Status'].forEach((label) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        headRow.append(cell);
      });
      head.append(headRow);
      const body = document.createElement('tbody');
      rows.forEach((entry) => {
        const row = document.createElement('tr');
        const historyCell = document.createElement('td');
        const title = document.createElement('p');
        title.className = 'font-semibold text-white';
        title.textContent = entry.title || 'Activity';
        historyCell.append(title);

        const userCell = document.createElement('td');
        userCell.className = 'text-slate-200';
        userCell.textContent = entry.actor || '—';

        const dateCell = document.createElement('td');
        dateCell.className = 'text-slate-300';
        dateCell.textContent = formatAuditTimestamp(entry.time);

        const statusCell = document.createElement('td');
        const statusLayout = document.createElement('div');
        statusLayout.className = 'flex flex-wrap items-center justify-between gap-2';
        const badge = document.createElement('span');
        const statusText = entry.status || entry.subtitle || 'Recorded';
        badge.className = `audit-status-badge ${getAuditStatusClass(statusText)}`.trim();
        badge.textContent = statusText;
        statusLayout.append(badge, createAuditDetailsButton(entry));
        statusCell.append(statusLayout);

        row.append(historyCell, userCell, dateCell, statusCell);
        body.append(row);
      });
      table.append(head, body);
      tableWrap.append(table);

      const cards = document.createElement('div');
      cards.className = 'audit-mobile-cards space-y-3';
      rows.forEach((entry) => {
        const card = document.createElement('article');
        card.className = 'rounded-xl border border-emerald-400/10 bg-[#020617]/75 p-4';
        const top = document.createElement('div');
        top.className = 'flex min-w-0 items-start justify-between gap-3';
        const content = document.createElement('div');
        content.className = 'min-w-0';
        const title = document.createElement('h3');
        title.className = 'break-words font-semibold text-white';
        title.textContent = entry.title || 'Activity';
        content.append(title);
        const time = document.createElement('time');
        time.className = 'shrink-0 text-right text-sm text-slate-400';
        time.textContent = formatAuditTimestamp(entry.time);
        top.append(content, time);
        card.append(top);
        const user = document.createElement('p');
        user.className = 'mt-2 text-sm text-slate-300';
        user.textContent = `User: ${entry.actor || '—'}`;
        card.append(user);
        const footer = document.createElement('div');
        footer.className = 'audit-mobile-card-footer';
        const badge = document.createElement('span');
        const statusText = entry.status || entry.subtitle || 'Recorded';
        badge.className = `audit-status-badge ${getAuditStatusClass(statusText)}`.trim();
        badge.textContent = statusText;
        footer.append(badge, createAuditDetailsButton(entry));
        card.append(footer);
        cards.append(card);
      });
      historyList.append(tableWrap, cards);
      renderAuditPagination(entries.length);
    }

    pagination.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      if (button.dataset.auditPage) auditCurrentPage = Number(button.dataset.auditPage);
      else if (button.dataset.auditPageAction === 'previous') auditCurrentPage -= 1;
      else if (button.dataset.auditPageAction === 'next') auditCurrentPage += 1;
      else return;
      hideAuditDetails();
      renderCurrentAuditPage();
      historyList.scrollTop = 0;
    });

    auditSearch.addEventListener('input', applyAuditFilters);
    auditDateFrom.addEventListener('change', applyAuditFilters);
    auditDateTo.addEventListener('change', applyAuditFilters);

    historyList.addEventListener('click', (event) => {
      const button = event.target.closest('[data-audit-details]');
      if (!button) return;
      if (!auditDetailsOverlay.hidden && auditDetailsTrigger === button) {
        hideAuditDetails(true);
        return;
      }
      showAuditDetails(button);
    });
    auditDetailsOverlay.addEventListener('click', (event) => {
      if (event.target === auditDetailsOverlay) hideAuditDetails(true);
    });
    document.addEventListener('keydown', (event) => {
      if (auditDetailsOverlay.hidden) return;
      if (event.key === 'Escape') {
        hideAuditDetails(true);
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = auditDetailsPopover.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])');
      if (!focusable.length) {
        event.preventDefault();
        auditDetailsPopover.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });

    async function loadBorrowHistory() {
      const response = await fetch('/api/borrow-audit', { cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Unable to load borrow history.');
      const records = (Array.isArray(payload) ? payload : []).map((event) => {
        const lastBorrower = event.lastBorrower?.name || '';
        return {
          title: event.equipmentName || event.equipmentId || 'Equipment',
          subtitle: `${String(event.eventType || 'activity').replaceAll('_', ' ')} · Borrower: ${event.borrowerName || '—'}`,
          actor: event.borrowerName || '—',
          time: event.occurredAt,
          status: String(event.eventType || 'Activity').replaceAll('_', ' '),
          details: [
            event.equipmentId ? `Item ID: ${event.equipmentId}` : '',
            event.borrowerCollege ? `College: ${event.borrowerCollege}` : '',
            event.currentHolders?.length ? `Current holder: ${event.currentHolders.map((holder) => `${holder.name} (${holder.quantity})`).join(', ')}` : 'Not currently borrowed',
            lastBorrower ? `Last borrower: ${lastBorrower}` : '',
            event.processedBy ? `Processed by: ${event.processedBy}` : '',
            event.purpose || ''
          ].filter(Boolean).join(' · '),
          isLastBorrower: Boolean(lastBorrower && (
            Number(event.lastBorrower?.userId) === currentUserId ||
            (!event.lastBorrower?.userId && currentUser.name &&
              lastBorrower.trim().toLowerCase() === String(currentUser.name).trim().toLowerCase())
          ))
        };
      });
      renderSummary([
        { label: 'Borrow events', value: String(records.length) },
        { label: 'Latest item', value: records[0]?.title || '—' },
        { label: 'Latest activity', value: records[0] ? formatAuditTimestamp(records[0].time) : '—' }
      ]);
      renderEntries(records, 'No borrow history is recorded for your account yet.');
    }

    async function loadScanHistory() {
      const response = await fetch('/api/equipment-scan-history', { cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Unable to load equipment scan history.');
      const entries = (Array.isArray(payload.data) ? payload.data : []).map((event) => ({
          equipmentId: event.equipmentId,
          title: event.equipmentName || event.equipmentId || 'Equipment',
          subtitle: `${event.actionType === 'equipment_issue_reported' ? 'Issue report' : 'QR scan'} · ${event.equipmentId || 'No item ID'}`,
          status: event.actionType === 'equipment_issue_reported' ? 'Reported' : 'Scanned',
          actor: Number(event.performedBy) === currentUserId
            ? 'You'
            : event.scannerRole === 'student'
              ? `${event.scannerName || event.performedByName || 'Student'}${[event.scannerProgram, event.scannerYear, event.scannerSection].filter(Boolean).length
                ? ` · ${[event.scannerProgram, event.scannerYear, event.scannerSection].filter(Boolean).join(' · ')}`
                : ''}`
              : event.scannerName || event.performedByName || 'Unknown user',
          time: event.actionTimestamp,
          details: [
            event.serialNumber ? `Serial: ${event.serialNumber}` : '',
            event.actionType === 'equipment_issue_reported'
              ? `Report${event.reportCategory ? `: ${event.reportCategory}` : ''}${event.maintenanceRequestId ? ` · Request #${event.maintenanceRequestId}` : ''}`
              : event.scannerRole ? `Scanned by: ${Number(event.performedBy) === currentUserId ? 'You' : event.scannerRole}` : '',
            event.actionDescription || (event.actionType === 'equipment_issue_reported' ? 'Equipment issue reported.' : 'Equipment QR code scanned.')
          ].filter(Boolean).join(' · ')
      }));
      renderSummary([
          { label: 'Equipment activity', value: String(payload.meta?.total ?? entries.length) },
          { label: 'Items involved', value: String(new Set(entries.map((entry) => entry.equipmentId).filter(Boolean)).size) },
        { label: 'Latest activity', value: entries[0] ? formatAuditTimestamp(entries[0].time) : '—' }
      ]);
      renderEntries(entries, 'No equipment scans or reports have been recorded yet.');
    }

    async function loadAssignmentHistory() {
      const response = await fetch('/api/faculty/assignment-history', { cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.success !== true) {
        throw new Error(payload.error || 'Unable to load equipment assignment history.');
      }
      const entries = (Array.isArray(payload.history) ? payload.history : []).map((event) => ({
        title: event.equipmentName || event.equipmentCode || 'Equipment',
        subtitle: event.actionType === 'accountability_removed'
          ? 'Assignment removed'
          : 'Assigned to you',
        status: event.actionType === 'accountability_removed' ? 'Removed' : 'Assigned',
        actor: event.performedByName || 'Administrator',
        time: event.actionTimestamp,
        details: [
          event.equipmentCode ? `Item ID: ${event.equipmentCode}` : '',
          event.serialNumber ? `Serial: ${event.serialNumber}` : '',
          event.performedByCollege ? `Admin college: ${event.performedByCollege}` : '',
          event.actionDescription || ''
        ].filter(Boolean).join(' · ')
      }));
      renderSummary([
        { label: 'Assignment events', value: String(entries.length) },
        { label: 'Latest item', value: entries[0]?.title || '—' },
        { label: 'Latest activity', value: entries[0] ? formatAuditTimestamp(entries[0].time) : '—' }
      ]);
      renderEntries(entries, 'No equipment assignment history is recorded for your account yet.');
    }

    async function loadAttendanceHistory() {
      const response = await fetch('/api/faculty/attendance-history', { cache: 'no-store' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.success !== true) {
        throw new Error(payload.error || 'Unable to load student attendance history.');
      }
      const attendance = Array.isArray(payload.attendance) ? payload.attendance : [];
      const counts = attendance.reduce((result, record) => {
        const status = String(record.status || 'Absent').toLowerCase();
        result[status] = (result[status] || 0) + 1;
        return result;
      }, {});
      const entries = attendance.map((record) => ({
        title: record.studentName || 'Unknown student',
        subtitle: `${record.subject || 'Class'} · ${record.status || 'Absent'}`,
        status: record.status || 'Absent',
        actor: record.studentId || 'Student number not recorded',
        time: record.recordedAt || record.date,
        details: [
          record.courseSection && record.courseSection !== '—' ? `Course/section: ${record.courseSection}` : '',
          `Class date: ${record.date || '—'}`,
          record.timeIn && record.timeIn !== 'Not recorded' ? `Time in: ${record.timeIn}` : 'No check-in recorded'
        ].filter(Boolean).join(' · ')
      }));
      renderSummary([
        { label: 'Attendance records', value: String(entries.length) },
        { label: 'Present / Late', value: `${counts.present || 0} / ${counts.late || 0}` },
        { label: 'Absent', value: String(counts.absent || 0) }
      ]);
      renderEntries(entries, 'No attendance records are available for your assigned schedules yet.');
    }

    async function loadAuditView() {
      const type = viewType.value;
      auditCurrentPage = 1;
      setAuditMessage('Loading history…');
      try {
        if (type === 'borrow') await loadBorrowHistory();
        else if (type === 'scan') await loadScanHistory();
        else if (type === 'attendance') await loadAttendanceHistory();
        else await loadAssignmentHistory();
      } catch (error) {
        console.error('Unable to load faculty audit history:', error);
        setAuditMessage(error.message || 'Unable to load audit history.', true);
      }
    }

    facultyActivityTab.addEventListener('click', () => {
      viewType.value = 'borrow';
      updateFacultyAuditTabs();
      loadAuditView();
    });
    viewType.addEventListener('change', () => {
      updateFacultyAuditTabs();
      loadAuditView();
    });
    updateFacultyAuditTabs();
    loadAuditView();
  </script>

  <script src="/js/student-sidebar-config.js?v=30" defer></script>
  <script src="/js/sidebar-component.js?v=127" defer></script>
