<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Dashboard | ComLab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/sidebar.css?v=96">
  <style>
    body.faculty-dashboard-page {
      --faculty-bg: var(--app-bg, #061a13);
      --faculty-panel: var(--app-card-bg, #0d2b20);
      --faculty-border: var(--app-border, #174b35);
      --faculty-green: var(--app-accent, #16a36a);
      --faculty-green-soft: rgba(22, 163, 74, .1);
      --faculty-green-strong: rgba(22, 163, 74, .3);
      --faculty-card-bg: var(--app-card-bg, #0d2b20);
      --faculty-card-border: var(--app-border, #174b35);
      --faculty-card-shadow: var(--app-shadow, 0 12px 32px rgba(0, 0, 0, .22));
      --faculty-text: var(--app-text, #e6f5ec);
      --faculty-muted: var(--app-text-secondary, #a7c5b4);
      --faculty-table-border: var(--app-border, #174b35);
      --faculty-table-bg: var(--app-table-bg, #0a2119);
      --faculty-table-header: var(--app-table-header-bg, #071a13);
      --faculty-table-row: var(--app-table-row-bg, #0a2119);
      --faculty-table-row-alt: var(--app-table-row-alt-bg, #0c281d);
      --faculty-hover: var(--app-hover-bg, #123b2b);
      --faculty-neutral-bg: #263a30;
      --faculty-neutral-text: #d3e2d9;
      --faculty-neutral-border: #426250;
      --faculty-status-bg: #fef3c7;
      --faculty-status-text: #92400e;
      --faculty-status-border: #fcd34d;
      --faculty-success-bg: #dcfce7;
      --faculty-success-text: #166534;
      --faculty-success-border: #86efac;
      --faculty-danger-bg: #ffe4e6;
      --faculty-danger-text: #9f1239;
      --faculty-danger-border: #fda4af;
      min-height: 100vh;
      color: var(--faculty-text);
      background: var(--faculty-bg);
    }

    html.theme-light body.faculty-dashboard-page {
      --faculty-panel: #ffffff;
      --faculty-border: #d7e8dc;
      --faculty-green: #15803d;
      --faculty-green-soft: rgba(22, 163, 74, .08);
      --faculty-green-strong: rgba(22, 101, 52, .22);
      --faculty-card-bg: #f6fbf7;
      --faculty-card-border: #cfe4d5;
      --faculty-card-shadow: 0 8px 20px rgba(22, 101, 52, .07);
      --faculty-muted: #54715d;
      --faculty-table-border: #d5e7da;
      --faculty-table-bg: #ffffff;
      --faculty-table-header: #eaf5ee;
      --faculty-table-row: #ffffff;
      --faculty-table-row-alt: #f4faf6;
      --faculty-hover: #e7f4ea;
      --faculty-neutral-bg: #edf4ef;
      --faculty-neutral-text: #496052;
      --faculty-neutral-border: #d4e3d8;
    }

    html.theme-dark body.faculty-dashboard-page {
      --faculty-green: #4ade80;
      --faculty-green-soft: rgba(74, 222, 128, .1);
      --faculty-green-strong: rgba(74, 222, 128, .28);
      --faculty-card-bg: #0b2a1f;
      --faculty-card-border: #1b563d;
      --faculty-table-border: #174b35;
      --faculty-table-bg: #0a2119;
      --faculty-table-header: #071a13;
      --faculty-table-row: #0a2119;
      --faculty-table-row-alt: #0c281d;
      --faculty-hover: #123b2b;
      --faculty-neutral-bg: #18372a;
      --faculty-neutral-text: #c4dfd0;
      --faculty-neutral-border: #315b45;
      --faculty-status-bg: #422006;
      --faculty-status-text: #fde68a;
      --faculty-status-border: #854d0e;
      --faculty-success-bg: #052e1b;
      --faculty-success-text: #86efac;
      --faculty-success-border: #166534;
      --faculty-danger-bg: #4c0519;
      --faculty-danger-text: #fda4af;
      --faculty-danger-border: #9f1239;
    }

    .main-container {
      min-height: 100vh;
      padding: 1.5rem .5rem 2.5rem;
    }

    body.student-portal .student-page-header {
      right: .5rem;
      left: calc(var(--sidebar-width) + .5rem);
      max-width: none;
    }

    .faculty-content {
      width: 100%;
      max-width: none;
      margin: 0;
    }

    .faculty-surface {
      border: 1px solid var(--faculty-border);
      border-radius: 1rem;
      background: var(--faculty-panel);
      box-shadow: var(--app-shadow, 0 8px 22px rgba(0, 0, 0, .12));
    }

    .faculty-stat {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: .75rem;
      min-height: 8.15rem;
      padding: .8rem .8rem .9rem;
      border: 1px solid var(--faculty-card-border);
      background: var(--faculty-card-bg);
      box-shadow: var(--faculty-card-shadow);
      transition: transform .18s ease, border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .faculty-stat:hover {
      transform: translateY(-3px);
      border-color: var(--faculty-green-strong);
      box-shadow: 0 14px 28px rgba(16, 120, 67, .14);
    }

    .faculty-stat:focus-visible {
      outline: 3px solid rgba(52, 211, 153, .9);
      outline-offset: 3px;
    }

    .faculty-stat h3 {
      font-size: .76rem;
      line-height: 1.3;
      letter-spacing: .02em;
      color: var(--faculty-muted);
    }

    .faculty-stat .fa-solid,
    .faculty-stat .fas,
    .faculty-stat .far,
    .faculty-stat .fal,
    .faculty-stat .fab {
      font-size: .8rem;
    }

    .faculty-stat [aria-live="polite"] {
      font-size: clamp(2rem, 1.7vw, 2.7rem) !important;
      line-height: 1 !important;
      letter-spacing: -.06em;
    }

    .faculty-action {
      min-height: 8.25rem;
      background: var(--faculty-panel);
      color: var(--faculty-text);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .faculty-action:hover {
      transform: translateY(-2px);
      border-color: var(--faculty-green-strong);
      background: var(--faculty-hover);
    }

    .faculty-list-row + .faculty-list-row {
      border-top: 1px solid var(--faculty-border);
    }

    .faculty-dashboard-table-wrap {
      --app-border: var(--faculty-table-border);
      --app-table-bg: var(--faculty-table-bg);
      --app-table-header-bg: var(--faculty-table-header);
      --app-table-row-bg: var(--faculty-table-row);
      --app-table-row-alt-bg: var(--faculty-table-row-alt);
      --app-hover-bg: var(--faculty-hover);
      border: 1px solid var(--faculty-table-border);
      border-radius: .9rem;
      background: var(--faculty-table-bg);
      box-shadow: 0 5px 16px rgba(22, 101, 52, .05);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-inline: contain;
      scrollbar-color: var(--faculty-green) var(--faculty-table-bg);
    }

    .faculty-dashboard-table {
      width: 100%;
      min-width: 38rem;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    .faculty-dashboard-table th {
      border: 0;
      border-bottom: 1px solid var(--faculty-border);
      background: var(--faculty-table-header);
      color: var(--faculty-text);
      padding: .85rem 1.15rem;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .faculty-dashboard-table td {
      border: 0;
      border-bottom: 1px solid var(--faculty-border);
      padding: .95rem 1.15rem;
      color: var(--faculty-text);
      font-size: .9rem;
      font-weight: 500;
      line-height: 1.55;
      vertical-align: middle;
    }

    .faculty-dashboard-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .faculty-dashboard-table .table-item-name {
      display: block;
      max-width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--faculty-green);
      font: inherit;
      font-size: .92rem;
      font-weight: 700;
      text-align: left;
      cursor: help;
    }

    .faculty-dashboard-table .table-item-name:focus-visible {
      border-radius: .2rem;
      outline: 2px solid var(--faculty-green);
      outline-offset: 2px;
    }

    .faculty-equipment-tooltip {
      position: fixed;
      z-index: 10001;
      display: none;
      max-width: min(22rem, calc(100vw - 2rem));
      padding: .65rem .85rem;
      border: 1px solid var(--faculty-green-strong);
      border-radius: .75rem;
      background: var(--faculty-green);
      color: #fff;
      box-shadow: var(--faculty-card-shadow);
      font-size: .9375rem;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .faculty-equipment-tooltip.is-visible {
      display: block;
    }

    .faculty-equipment-tooltip-trigger {
      display: inline-block;
      max-width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: help;
    }

    .faculty-equipment-tooltip-trigger:focus-visible {
      border-radius: .2rem;
      outline: 2px solid var(--faculty-green);
      outline-offset: 2px;
    }

    .faculty-status {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--faculty-status-border);
      border-radius: 999px;
      background: var(--faculty-status-bg);
      color: var(--faculty-status-text);
      padding: .32rem .72rem;
      font-size: .76rem;
      font-weight: 750;
      line-height: 1.2;
      white-space: nowrap;
    }

    @media (max-width: 1023px) {
      .main-container {
        margin-left: 0 !important;
      }

      body.student-portal .student-page-header {
        right: .5rem;
        left: .5rem;
      }
    }
  </style>

<style>
  html body.app-shell.student-portal.faculty-page.faculty-dashboard-page.system-layout-page .main-container > main.faculty-content {
    box-sizing: border-box;
    width: 100%;
    max-width: 1600px;
    margin: 0 auto !important;
    padding: 0 clamp(1rem, 2.2vw, 2rem) 2rem !important;
    gap: 1.35rem !important;
  }

  body.faculty-dashboard-page .faculty-metric-grid {
    gap: 1rem !important;
  }

  body.faculty-dashboard-page .faculty-stat {
    --faculty-metric-accent: var(--faculty-green);
    --faculty-metric-tint: var(--faculty-green-soft);
    --faculty-metric-border: var(--faculty-card-border);
    position: relative;
    min-width: 0;
    border-color: var(--faculty-metric-border);
    border-radius: 1rem;
    background: var(--faculty-card-bg);
    box-shadow: var(--faculty-card-shadow);
  }

  body.faculty-dashboard-page .faculty-metric-grid > .faculty-stat {
    min-height: 9.25rem !important;
    padding: 1rem 1.05rem !important;
  }

  body.faculty-dashboard-page .faculty-stat::before {
    position: absolute;
    top: 0;
    right: 1rem;
    left: 1rem;
    height: 2px;
    background: var(--faculty-metric-accent);
    content: "";
    opacity: .55;
  }

  body.faculty-dashboard-page .faculty-stat > * {
    position: relative;
    z-index: 1;
  }

  body.faculty-dashboard-page .faculty-stat .dashboard-kpi-icon {
    flex: 0 0 2.65rem;
    width: 2.65rem;
    height: 2.65rem;
    border-radius: .9rem;
    border: 1px solid var(--faculty-metric-border);
    background: var(--faculty-metric-tint);
    color: var(--faculty-metric-accent);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22);
  }

  body.faculty-dashboard-page .faculty-stat h3 {
    color: var(--faculty-muted) !important;
    font-size: .8rem;
    font-weight: 750;
    line-height: 1.45;
    letter-spacing: .01em;
  }

  body.faculty-dashboard-page .faculty-stat .dashboard-kpi-value {
    margin-top: auto;
    padding-top: .65rem;
    color: var(--faculty-text) !important;
    font-size: clamp(2rem, 2.35vw, 2.55rem) !important;
    font-weight: 850;
    letter-spacing: -.055em;
    text-shadow: none;
  }

  body.faculty-dashboard-page .faculty-surface:not(.faculty-stat) {
    border-color: var(--faculty-border);
    border-radius: 1rem;
    background: var(--faculty-panel);
    box-shadow: var(--app-shadow, 0 8px 22px rgba(0, 0, 0, .12));
  }

  body.faculty-dashboard-page .faculty-content > section.grid {
    gap: 1.25rem !important;
  }

  body.faculty-dashboard-page .faculty-content .faculty-surface:not(.faculty-stat) > div:first-child {
    min-height: 4.25rem;
    padding: 1rem 1.35rem !important;
    border-bottom-color: var(--faculty-border);
    background: var(--faculty-table-header);
  }

  body.faculty-dashboard-page .faculty-content .section-heading {
    color: var(--faculty-text);
    font-size: 1.05rem;
    font-weight: 750;
    letter-spacing: -.015em;
  }

  body.faculty-dashboard-page .faculty-content .section-link {
    display: inline-flex;
    align-items: center;
    gap: .25rem;
    border: 1px solid var(--faculty-green-strong);
    border-radius: .65rem;
    padding: .48rem .7rem;
    background: var(--faculty-green-soft);
    color: var(--faculty-green);
    font-size: .82rem;
    transition: background .16s ease, border-color .16s ease, color .16s ease;
  }

  body.faculty-dashboard-page .faculty-content .section-link:hover {
    border-color: var(--faculty-green);
    background: var(--faculty-hover);
    color: var(--faculty-text);
  }

  body.faculty-dashboard-page .faculty-content .section-link:focus-visible {
    outline: 2px solid var(--faculty-green);
    outline-offset: 2px;
  }

  body.faculty-dashboard-page .faculty-dashboard-table {
    min-width: 34rem;
  }

  body.faculty-dashboard-page .faculty-dashboard-table th {
    padding: .78rem 1.15rem;
    border-bottom-color: var(--faculty-border);
    background: var(--faculty-table-header);
    color: var(--faculty-text);
    font-size: .72rem;
    font-weight: 750;
    letter-spacing: .09em;
  }

  body.faculty-dashboard-page .faculty-dashboard-table td {
    padding: .9rem 1.15rem;
    border-bottom-color: var(--faculty-border);
    color: var(--faculty-text);
    font-size: .88rem;
    line-height: 1.45;
  }

  body.faculty-dashboard-page .faculty-dashboard-table tbody tr {
    background: var(--faculty-table-row);
    transition: background .16s ease;
  }

  body.faculty-dashboard-page .faculty-dashboard-table tbody tr:nth-child(even) {
    background: var(--faculty-table-row-alt);
  }

  body.faculty-dashboard-page .faculty-dashboard-table tbody tr:hover {
    background: var(--faculty-hover);
  }

  body.faculty-dashboard-page .faculty-dashboard-table .table-item-name {
    color: var(--faculty-green);
    font-size: .9rem;
    font-weight: 700;
  }

  body.faculty-dashboard-page .faculty-dashboard-table tbody td:last-child {
    color: var(--faculty-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  body.faculty-dashboard-page .faculty-dashboard-table .faculty-assigned-date {
    color: var(--faculty-green);
    font-weight: 700;
  }

  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="returned"],
  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="resolved"] {
    border-color: var(--faculty-success-border);
    background: var(--faculty-success-bg);
    color: var(--faculty-success-text);
  }

  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="approved"],
  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="borrowed"] {
    border-color: var(--faculty-success-border);
    background: var(--faculty-success-bg);
    color: var(--faculty-success-text);
  }

  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="rejected"] {
    border-color: var(--faculty-danger-border);
    background: var(--faculty-danger-bg);
    color: var(--faculty-danger-text);
  }

  body.faculty-dashboard-page .faculty-dashboard-table .faculty-status[data-status="cancelled"] {
    border-color: var(--faculty-neutral-border);
    background: var(--faculty-neutral-bg);
    color: var(--faculty-neutral-text);
  }

  body.faculty-dashboard-page .faculty-content [aria-live="polite"] > p.text-slate-400 {
    color: var(--faculty-muted);
  }

  body.faculty-dashboard-page #dashboardError {
    border-color: var(--faculty-danger-border);
    background: var(--faculty-danger-bg);
    color: var(--faculty-danger-text);
  }

  @media (max-width: 767px) {
    body.faculty-dashboard-page .faculty-metric-grid {
      gap: .75rem !important;
    }

    body.faculty-dashboard-page .faculty-metric-grid > .faculty-stat {
      min-height: 8.5rem !important;
      padding: .9rem !important;
    }

    body.faculty-dashboard-page .faculty-content > section.grid {
      gap: 1rem !important;
    }

    body.faculty-dashboard-page .faculty-content .faculty-surface > div:first-child {
      padding: .9rem 1rem !important;
    }

    body.faculty-dashboard-page .faculty-dashboard-table th,
    body.faculty-dashboard-page .faculty-dashboard-table td {
      padding: .75rem .85rem;
    }
  }

</style>

<body class="app-shell student-portal faculty-page faculty-dashboard-page faculty-page-heading-page system-layout-page">
  <script>window.__CURRENT_USER__ = __CURRENT_USER_JSON__;</script>
  <div id="shared-sidebar"></div>

  <div class="main-container">
    <main class="faculty-content grid gap-3">
      <div class="system-dashboard-heading">

          <button id="mobileMenuToggle" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
        </div>
        <div class="system-dashboard-heading-actions">

          <div class="system-profile-badge">
            <span class="system-profile-badge-avatar" data-user-initials>FC</span>
            <span class="system-profile-badge-copy">

              <span class="system-profile-badge-role" data-user-role>Faculty</span>

          </div>

        </div>
      </div>
      <section aria-label="My Faculty metrics" class="faculty-metric-grid dashboard-kpi-grid grid grid-cols-5 gap-3">
        <a href="/faculty-my-requests" aria-label="View my active borrowings" class="faculty-surface faculty-stat faculty-stat--borrowings dashboard-kpi-card group cursor-pointer p-5 transition duration-200 hover:-translate-y-1 hover:border-emerald-400/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="dashboard-kpi-label text-base font-bold leading-snug text-emerald-100">My active borrowings</h3>
            <span class="dashboard-kpi-icon grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-emerald-400/10 text-emerald-300"><i class="fas fa-box-open" aria-hidden="true"></i></span>
          </div>
          <p id="activeBorrowCount" class="dashboard-kpi-value mt-4 text-4xl font-extrabold leading-none text-white sm:text-5xl" aria-live="polite">—</p>
        </a>

        <a href="/faculty-mir-items" aria-label="View items assigned to me" class="faculty-surface faculty-stat faculty-stat--assigned dashboard-kpi-card group cursor-pointer p-5 transition duration-200 hover:-translate-y-1 hover:border-emerald-400/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="dashboard-kpi-label text-base font-bold leading-snug text-emerald-100">Items assigned to me</h3>
            <span class="dashboard-kpi-icon grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-emerald-400/10 text-emerald-300"><i class="fas fa-laptop" aria-hidden="true"></i></span>
          </div>
          <p id="assignedEquipmentCount" class="dashboard-kpi-value mt-4 text-4xl font-extrabold leading-none text-white sm:text-5xl" aria-live="polite">—</p>
        </a>
        <a href="/faculty-my-requests" aria-label="View my total requests" class="faculty-surface faculty-stat faculty-stat--requests dashboard-kpi-card group cursor-pointer p-5 transition duration-200 hover:-translate-y-1 hover:border-emerald-400/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="dashboard-kpi-label text-base font-bold leading-snug text-emerald-100">My total requests</h3>
            <span class="dashboard-kpi-icon grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-emerald-400/10 text-emerald-300"><i class="fas fa-clipboard-list" aria-hidden="true"></i></span>
          </div>
          <p id="facultyRequestCount" class="dashboard-kpi-value mt-4 text-4xl font-extrabold leading-none text-white sm:text-5xl" aria-live="polite">—</p>
        </a>
        <a href="/faculty-my-requests" aria-label="View my pending requests" class="faculty-surface faculty-stat faculty-stat--pending dashboard-kpi-card group cursor-pointer p-5 transition duration-200 hover:-translate-y-1 hover:border-emerald-400/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="dashboard-kpi-label text-base font-bold leading-snug text-emerald-100">Pending requests</h3>
            <span class="dashboard-kpi-icon grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-emerald-400/10 text-emerald-300"><i class="fas fa-hourglass-half" aria-hidden="true"></i></span>
          </div>
          <p id="facultyPendingCount" class="dashboard-kpi-value mt-4 text-4xl font-extrabold leading-none text-white sm:text-5xl" aria-live="polite">—</p>
        </a>
        <a href="/faculty-my-requests?tab=student-requests" aria-label="View Student requests for equipment assigned to me" class="faculty-surface faculty-stat faculty-stat--student-requests dashboard-kpi-card group cursor-pointer p-5 transition duration-200 hover:-translate-y-1 hover:border-emerald-400/40 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-300 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <h3 class="dashboard-kpi-label text-base font-bold leading-snug text-emerald-100">Student requests</h3>
            <span class="dashboard-kpi-icon grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-amber-400/10 text-amber-300"><i class="fas fa-user-clock" aria-hidden="true"></i></span>
          </div>
          <p id="studentApprovalCount" class="dashboard-kpi-value mt-4 text-4xl font-extrabold leading-none text-white sm:text-5xl" aria-live="polite">—</p>
        </a>
      </section>

      <section class="grid gap-5">
        <div class="faculty-surface overflow-hidden">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-emerald-400/10 px-5 py-5 sm:px-6">
            <div class="min-w-0">
              <h3 class="section-heading text-lg font-bold leading-snug text-white">My recent requests</h3>
            </div>
            <a href="/faculty-my-requests" class="section-link shrink-0 whitespace-nowrap text-base font-bold text-emerald-300 hover:text-emerald-200">View all <i class="fas fa-arrow-right ml-1" aria-hidden="true"></i></a>
          </div>
          <div id="myRequestList" aria-live="polite" class="min-h-24">
            <p class="px-5 py-7 text-base text-slate-400 sm:px-6">Loading your requests…</p>
          </div>
        </div>
      </section>

      <section id="assignedEquipmentPanel" class="faculty-surface scroll-mt-24 overflow-hidden" tabindex="-1" aria-labelledby="assignedEquipmentTitle">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-emerald-400/10 px-5 py-5 sm:px-6">
          <div class="min-w-0">
            <h3 id="assignedEquipmentTitle" class="section-heading text-lg font-bold leading-snug text-white">Equipment assigned to you</h3>
          </div>
          <div class="flex flex-wrap gap-4">
            <a href="/faculty-mir-items" class="section-link shrink-0 whitespace-nowrap text-base font-bold text-emerald-300 hover:text-emerald-200">View all MR items <i class="fas fa-arrow-right ml-1" aria-hidden="true"></i></a>
            <a href="/faculty-audit-history?view=assignment" class="section-link shrink-0 whitespace-nowrap text-base font-bold text-emerald-300 hover:text-emerald-200">Assignment history</a>
          </div>
        </div>
        <div id="assignedEquipmentList" aria-live="polite" class="min-h-24">
          <p class="px-5 py-7 text-base text-slate-400 sm:px-6">Loading equipment assigned to you…</p>
        </div>
      </section>

      <p id="dashboardError" role="alert" class="hidden rounded-xl border border-rose-400/20 bg-rose-950/30 px-4 py-3 text-sm text-rose-200"></p>
    </main>
  </div>

  <script>
    const currentUser = window.__CURRENT_USER__ || {};
    const currentUserId = Number(currentUser.id);

    const activeBorrowCount = document.getElementById('activeBorrowCount');

    function formatDate(value) {
      if (!value) return 'Date not set';
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function createDashboardTable(container, captionText, headers) {
      const wrapper = document.createElement('div');
      wrapper.className = 'faculty-dashboard-table-wrap';
      const table = document.createElement('table');
      table.className = 'faculty-dashboard-table';
      const caption = document.createElement('caption');
      caption.className = 'sr-only';
      caption.textContent = captionText;
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      headers.forEach((label) => {
        const header = document.createElement('th');
        header.scope = 'col';
        header.textContent = label;
        headerRow.append(header);
      });
      thead.append(headerRow);
      const tbody = document.createElement('tbody');
      table.append(caption, thead, tbody);
      wrapper.append(table);
      container.append(wrapper);
      return tbody;
    }

    function renderRequestList(container, rows, type) {
      if (!container) return;
      container.replaceChildren();
      if (!rows.length) {
        const empty = document.createElement('p');
        empty.className = 'px-5 py-7 text-base text-slate-400 sm:px-6';
        empty.textContent = type === 'approval'
          ? 'No requests are waiting for your approval.'
          : 'You have not submitted any borrow requests yet.';
        container.append(empty);
        return;
      }
      const body = createDashboardTable(container, 'My recent requests', ['Equipment', 'Status', 'Requested']);
      rows.slice(0, 4).forEach((record) => {
        const row = document.createElement('tr');
        const equipmentCell = document.createElement('td');
        const name = document.createElement('p');
        name.className = 'table-item-name';
        name.textContent = type === 'approval'
          ? `${record.borrowerName || 'Faculty'} · ${record.equipmentName || record.equipmentId || 'Equipment'}`
          : record.equipmentName || record.equipmentId || 'Equipment';
        equipmentCell.append(name);

        const statusCell = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'faculty-status';
        badge.textContent = type === 'approval' ? 'Review' : (record.effectiveStatus || record.status || 'Pending');
        badge.dataset.status = badge.textContent.trim().toLowerCase().replace(/[\s_]+/g, '-');
        statusCell.append(badge);

        const dateCell = document.createElement('td');
        dateCell.textContent = formatDate(record.createdAt || record.created_at || record.borrowDate);
        row.append(equipmentCell, statusCell, dateCell);
        body.append(row);
      });
    }

    function formatDateTime(value) {
      if (!value) return 'Date not recorded';
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function renderAssignedEquipment(assignments) {
      const container = document.getElementById('assignedEquipmentList');
      const count = document.getElementById('assignedEquipmentCount');
      count.textContent = String(assignments.length);
      container.replaceChildren();
      if (!assignments.length) {
        const empty = document.createElement('p');
        empty.className = 'px-5 py-7 text-base text-slate-400 sm:px-6';
        empty.textContent = 'No equipment is currently assigned to you.';
        container.append(empty);
        return;
      }

      const body = createDashboardTable(container, 'Equipment assigned to you', ['Equipment', 'Assigned']);
      assignments.forEach((item) => {
        const row = document.createElement('tr');
        const equipmentCell = document.createElement('td');
        const name = document.createElement('button');
        const equipmentName = item.name || 'Equipment';
        const equipmentCode = item.equipmentId || '';
        const location = item.laboratoryRoom || item.location || item.campus || '';
        const metadata = [
          item.serialNumber ? `Serial: ${item.serialNumber}` : '',
          location
        ].filter(Boolean).join(' · ') || 'Additional equipment details unavailable.';
        name.className = 'table-item-name';
        name.type = 'button';
        name.textContent = `${equipmentName}${equipmentCode ? ` (${equipmentCode})` : ''}`;
        name.dataset.facultyEquipmentDetails = metadata;
        name.setAttribute('aria-describedby', 'facultyEquipmentTooltip');
        name.setAttribute('aria-label', `${name.textContent}; ${metadata}`);
        equipmentCell.append(name);

        const assignedCell = document.createElement('td');
        const assignedDate = document.createElement('time');
        assignedDate.className = 'faculty-assigned-date';
        if (item.assignedAt) assignedDate.dateTime = String(item.assignedAt);
        assignedDate.textContent = formatDateTime(item.assignedAt);
        assignedCell.append(assignedDate);
        row.append(equipmentCell, assignedCell);
        body.append(row);
      });
    }

    function setupFacultyEquipmentTooltip() {
      const tooltip = document.createElement('div');
      tooltip.id = 'facultyEquipmentTooltip';
      tooltip.className = 'faculty-equipment-tooltip';
      tooltip.setAttribute('role', 'tooltip');
      document.body.append(tooltip);

      const hideTooltip = () => tooltip.classList.remove('is-visible');
      const showTooltip = (trigger) => {
        tooltip.textContent = trigger.dataset.facultyEquipmentDetails || 'Additional equipment details unavailable.';
        tooltip.classList.add('is-visible');
        const triggerRect = trigger.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const left = Math.min(Math.max(8, triggerRect.left), window.innerWidth - tooltipRect.width - 8);
        const top = triggerRect.top - tooltipRect.height - 8 >= 8
          ? triggerRect.top - tooltipRect.height - 8
          : Math.min(triggerRect.bottom + 8, window.innerHeight - tooltipRect.height - 8);
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${Math.max(8, top)}px`;
      };

      document.addEventListener('mouseover', (event) => {
        if (!(event.target instanceof Element)) return;
        const trigger = event.target.closest('[data-faculty-equipment-details]');
        if (trigger && !trigger.contains(event.relatedTarget)) showTooltip(trigger);
      });
      document.addEventListener('mouseout', (event) => {
        if (!(event.target instanceof Element)) return;
        const trigger = event.target.closest('[data-faculty-equipment-details]');
        if (trigger && !trigger.contains(event.relatedTarget)) hideTooltip();
      });
      document.addEventListener('focusin', (event) => {
        if (!(event.target instanceof Element)) return;
        const trigger = event.target.closest('[data-faculty-equipment-details]');
        if (trigger) showTooltip(trigger);
      });
      document.addEventListener('focusout', (event) => {
        if (event.target instanceof Element && event.target.closest('[data-faculty-equipment-details]')) {
          hideTooltip();
        }
      });
      window.addEventListener('scroll', hideTooltip, true);
      window.addEventListener('resize', hideTooltip);
    }

    async function loadAssignedEquipment() {
      const container = document.getElementById('assignedEquipmentList');
      const count = document.getElementById('assignedEquipmentCount');
      try {
        const response = await fetch('/api/faculty/assigned-equipment', { cache: 'no-store' });
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload?.error || `Could not load your assigned equipment (HTTP ${response.status}).`);
        }
        const assignments = Array.isArray(payload)
          ? payload
          : Array.isArray(payload?.assignments)
            ? payload.assignments
            : Array.isArray(payload?.data)
              ? payload.data
              : null;
        if (!assignments) {
          const responseShape = payload && typeof payload === 'object'
            ? Object.keys(payload).join(', ') || 'empty response'
            : 'invalid JSON response';
          throw new Error(`Could not load your assigned equipment (unexpected API response: ${responseShape}).`);
        }
        renderAssignedEquipment(assignments);
      } catch (error) {
        count.textContent = '—';
        container.replaceChildren();
        const message = document.createElement('p');
        message.className = 'px-5 py-7 text-base text-rose-300 sm:px-6';
        message.textContent = error.message || 'Unable to load your assigned equipment.';
        container.append(message);
        console.error('Failed to load Faculty equipment assignments:', error);
      }
    }

    async function loadFacultyDashboard() {
      const error = document.getElementById('dashboardError');
      try {
        const response = await fetch('/api/borrow-records', { cache: 'no-store' });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !Array.isArray(payload)) {
          throw new Error(payload?.error || 'Could not load Faculty borrowing activity.');
        }

        const ownRequests = payload.filter((record) =>
          record.isMyRequest === true && Number(record.requesterUserId) === currentUserId
        );
        const studentApprovals = payload.filter((record) =>
          String(record.requesterRole || record.borrowerType || '').toLowerCase() === 'student' &&
          (record.canApprove === true || record.canReturnStudentBorrow === true) &&
          ['pending', 'borrowed'].includes(String(record.status || '').toLowerCase())
        );
        const active = ownRequests.filter((record) =>
          ['approved', 'borrowed'].includes(String(record.status || '').toLowerCase())
        );
        activeBorrowCount.textContent = String(active.length);
        document.getElementById('facultyRequestCount').textContent = String(ownRequests.length);
        document.getElementById('facultyPendingCount').textContent = String(ownRequests.filter((record) =>
          String(record.effectiveStatus || record.status || '').toLowerCase() === 'pending'
        ).length);
        document.getElementById('studentApprovalCount').textContent = String(studentApprovals.length);
        renderRequestList(document.getElementById('myRequestList'), ownRequests, 'mine');
      } catch (loadError) {
        activeBorrowCount.textContent = '—';
        document.getElementById('facultyRequestCount').textContent = '—';
        document.getElementById('facultyPendingCount').textContent = '—';
        document.getElementById('myRequestList').textContent = 'Unable to load your borrow requests.';
        document.getElementById('studentApprovalCount').textContent = '—';
        error.textContent = loadError.message || 'Faculty dashboard data could not be loaded. Please refresh to try again.';
        error.classList.remove('hidden');
        console.error('Failed to load Faculty dashboard:', loadError);
      }
    }

    setupFacultyEquipmentTooltip();
    loadFacultyDashboard();
    loadAssignedEquipment();
  </script>
  <script src="/js/student-sidebar-config.js?v=30" defer></script>
  <script src="/js/sidebar-component.js?v=127" defer></script>
