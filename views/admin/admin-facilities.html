<head>

  <style>
    :root { color-scheme: light dark; }
    body.app-shell.admin-facilities-page {
      --page-bg: #061A13;
      --panel-bg: linear-gradient(145deg, rgba(17, 43, 29, .98), rgba(9, 27, 18, .98));
      --surface: #0b1e14;
      --text: #edf8f1;
      --muted: #a5c4b1;
      --line: rgba(110, 231, 183, .2);
      --accent: #4ade80;
      --accent-strong: #16a34a;
      --soft: rgba(34, 197, 94, .12);
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(ellipse at 82% 0%, rgba(34, 197, 94, .11), transparent 38%), var(--page-bg);
      font-family: Inter, "Segoe UI", sans-serif;
    }
    html.theme-light body.app-shell.admin-facilities-page {
      --page-bg: #FFFFFF;
      --panel-bg: #ffffff;
      --surface: #ffffff;
      --text: #1E293B;
      --muted: #64748b;
      --line: #E5E7EB;
      --header-divider: #E5E7EB;
      --accent: #16a34a;
      --accent-strong: #15803d;
      --soft: #DCFCE7;
      background: var(--page-bg);
    }
    .facilities-main {
      box-sizing: border-box;
      min-height: 100vh;
      margin-left: var(--sidebar-width, 250px);
      padding: 0 .55rem .35rem;
    }
    .facilities-heading-main {
      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: center;
    }
    .facilities-context-bar {
      display: flex;
      min-height: 2.2rem;
      align-items: center;
      justify-content: flex-start;
      gap: .55rem;
      margin: 0 0 .45rem;
      padding: 0 .25rem;
    }
    .facilities-workspace {
      width: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .facilities-tabs {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: .18rem;
      overflow-x: auto;
      padding: 0;
      border: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(74, 222, 128, .3) transparent;
    }
    .facilities-tab {
      display: inline-flex;
      min-height: 2.05rem;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: .38rem;
      padding: .34rem .58rem;
      border: 1px solid transparent;
      border-radius: .62rem;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .69rem;
      font-weight: 750;
      line-height: 1.1;
      white-space: nowrap;
      cursor: pointer;
      transition: color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .facilities-tab i { color: var(--accent); font-size: .72rem; }
    .facilities-tab:hover { transform: translateY(-1px); background: var(--soft); color: var(--text); }
    .facilities-tab[aria-selected="true"] {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent-strong) 28%, var(--surface)), color-mix(in srgb, var(--surface) 85%, var(--accent-strong)));
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
    }
    .facilities-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* The legacy tab strip is scrollable because it hosts the embedded table
       tabs. The replacement header menu must remain an intrinsic, non-scrolling
       flex item so its flyout can escape the header normally. */
    .facilities-management-menu {
      position: relative;
      z-index: 20;
      display: block;
      width: max-content;
      max-width: 100%;
      min-width: 0;
      height: auto;
      max-height: none;
      overflow: visible !important;
      padding: 0;
      scrollbar-width: none;
    }
    .facilities-management-menu::-webkit-scrollbar { display: none; }
    .facilities-heading-main,
    .facilities-heading {
      box-sizing: border-box;
      overflow: visible;
    }
    .facilities-management-trigger {
      display: inline-flex;
      width: auto;
      max-width: 100%;
      box-sizing: border-box;
      min-height: 2.2rem;
      align-items: center;
      gap: .45rem;
      padding: .38rem .7rem;
      border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--line));
      border-radius: .68rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: .72rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .facilities-management-trigger > i:first-child { color: var(--accent); }
    .facilities-management-trigger .facilities-menu-chevron { color: var(--muted); font-size: .65rem; transition: transform .16s ease; }
    .facilities-management-trigger[aria-expanded="true"] .facilities-menu-chevron { transform: rotate(180deg); }
    .facilities-management-trigger:hover,
    .facilities-management-trigger:focus-visible { border-color: var(--accent); background: var(--soft); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    .facilities-management-dropdown {
      position: absolute;
      top: calc(100% + .38rem);
      left: 0;
      display: grid;
      width: min(16rem, calc(100vw - 2rem));
      gap: .18rem;
      padding: .4rem;
      border: 1px solid var(--line);
      border-radius: .8rem;
      background: var(--surface);
      box-shadow: 0 14px 32px rgba(2, 18, 11, .22);
      opacity: 0;
      transform: translateY(-.3rem) scale(.98);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
    }
    .facilities-management-dropdown:not([hidden]) { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .facilities-management-item {
      display: grid;
      grid-template-columns: 1.2rem minmax(0, 1fr) auto;
      align-items: center;
      gap: .55rem;
      width: 100%;
      min-height: 2.2rem;
      padding: .45rem .55rem;
      border: 0;
      border-radius: .55rem;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .facilities-management-item > i:first-child { color: var(--accent); text-align: center; }
    .facilities-management-item .facilities-menu-check { visibility: hidden; color: var(--accent); font-size: .65rem; }
    .facilities-management-item:hover,
    .facilities-management-item:focus-visible { background: var(--soft); outline: none; }
    .facilities-management-item[aria-checked="true"] { background: color-mix(in srgb, var(--soft) 82%, var(--surface)); color: var(--accent-strong); }
    .facilities-management-item[aria-checked="true"] .facilities-menu-check { visibility: visible; }
    @media (max-width: 540px) {
      .facilities-management-trigger { min-height: 1.95rem; padding: .3rem .52rem; font-size: .65rem; }
      .facilities-management-dropdown { width: min(15rem, calc(100vw - 1.5rem)); }
    }
    .facilities-content { padding: 0; }
    .facilities-frame {
      display: block;
      width: 100%;
      height: calc(100dvh - 6.45rem);
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    @media (max-width: 1023px) {
      .facilities-main { margin-left: 0; padding: 0 .5rem .35rem; }
      .facilities-frame { height: calc(100dvh - 6.45rem - env(safe-area-inset-top, 0px)); }
    }
    @media (max-width: 540px) {
      .facilities-main { padding-right: .35rem; padding-left: .35rem; }
      .facilities-heading { padding-right: .25rem !important; padding-left: .25rem !important; }
      .facilities-tabs { gap: .1rem; }
      .facilities-tab { min-height: 1.9rem; padding: .3rem .43rem; font-size: .64rem; }
      .facilities-frame { height: calc(100dvh - 6.45rem - env(safe-area-inset-top, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .facilities-tab { transition-duration: .01ms; }
    }
  </style>
</head>

        }
      };
      new MutationObserver(() => applyEmbeddedLayout()).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      frame.style.visibility = 'hidden';
      frame.addEventListener('load', () => {
        applyEmbeddedLayout();
        frame.style.visibility = 'visible';
      });
      const closeMenu = () => {
        menu.hidden = true;
        menuToggle.setAttribute('aria-expanded', 'false');
      };
      menuToggle.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const isOpen = !menu.hidden;
        menu.hidden = isOpen;
        menuToggle.setAttribute('aria-expanded', String(!isOpen));
        if (isOpen) menuToggle.focus();
        else menuItems.find((item) => item.getAttribute('aria-checked') === 'true')?.focus();
      });
      document.querySelector('.facilities-header-tabs').addEventListener('click', (event) => {
        const tab = event.target.closest('[data-facilities-tab]');
        if (!tab || !tabs.includes(tab)) return;
        event.preventDefault();
        event.stopPropagation();
        setActiveTab(tab.dataset.facilitiesTab);
      }, true);
      document.querySelector('.facilities-header-tabs').addEventListener('keydown', (event) => {
        if (event.target === menuToggle && ['ArrowDown', 'Enter', ' '].includes(event.key)) {
          event.preventDefault();
          menu.hidden = false;
          menuToggle.setAttribute('aria-expanded', 'true');
          menuItems.find((item) => item.getAttribute('aria-checked') === 'true')?.focus();
          return;
        }
        if (event.target === menuToggle || !['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        const currentIndex = tabs.indexOf(document.activeElement);
        const nextIndex = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (currentIndex + (event.key === 'ArrowDown' ? 1 : tabs.length - 1)) % tabs.length;
        tabs[nextIndex].focus();
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.facilities-management-menu')) closeMenu();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !menu.hidden) {
          closeMenu();
          menuToggle.focus();
        }
      });
      const requestedTab = window.location.hash.slice(1);
      setActiveTab(routes[requestedTab] ? requestedTab : 'inventory', false);
    })();
  </script>
  <script src="/js/sidebar-component.js?v=127" defer></script>
