      --text: #16271d;
      --muted: #5c7566;
      --line: rgba(22, 101, 52, .17);
      --accent: #168044;
      --accent-strong: #15803d;
      background: radial-gradient(ellipse at 82% 0%, rgba(34, 197, 94, .08), transparent 38%), var(--page-bg);

    .facilities-main {

      min-height: 100vh;

      display: flex;
      min-width: 0;
      flex: 1 1 auto;
      align-items: center;
    }
    .facilities-workspace {
      width: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .facilities-tabs {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: .18rem;
      overflow-x: auto;
      padding: 0;
      border: 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(74, 222, 128, .3) transparent;
    }
    .facilities-tab {
      display: inline-flex;
      min-height: 2.05rem;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: .38rem;
      padding: .34rem .58rem;
      border: 1px solid transparent;
      border-radius: .62rem;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .69rem;
      font-weight: 750;
      line-height: 1.1;
      white-space: nowrap;
      cursor: pointer;

      background: linear-gradient(145deg, color-mix(in srgb, var(--accent-strong) 28%, var(--surface)), color-mix(in srgb, var(--surface) 85%, var(--accent-strong)));

    .facilities-frame {

      width: 100%;
      height: calc(100dvh - 3.4rem);
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;

            min-width: 3rem !important; min-height: 2rem !important; padding: .25rem .42rem !important; font-size: .68rem !important;
          }
          html body.app-shell.facilities-embedded.equipment-assignment-page.admin-shell .assignment-table .show-history {
            width: 1.9rem !important; min-width: 1.9rem !important; min-height: 2rem !important; padding: .2rem !important;
          }
          html body.app-shell.facilities-embedded.equipment-assignment-page.admin-shell #assignmentPaginationFooter {
            min-height: 2.7rem !important; padding: .3rem .6rem !important;
          }
        }
        html body.app-shell.facilities-embedded.system-layout-page.equipment-inventory-page .main-container { min-height: 0 !important; height: 100% !important; }
        html body.app-shell.facilities-embedded.system-layout-page.equipment-inventory-page .page-content { min-height: 0 !important; }
        html body.app-shell.facilities-embedded.system-layout-page #mainContainer:has(#equipment-availability-view.active) > .main-content { padding: .25rem !important; }
        html body.app-shell.facilities-embedded.system-layout-page #mainContainer:has(#equipment-availability-view.active) .equipment-availability-page { margin-top: 0 !important; }
        html body.app-shell.facilities-embedded.admin-borrow-equipment-page .main-container { margin: 0 !important; padding: .35rem !important; }
        html body.app-shell.facilities-embedded.admin-borrow-equipment-page .page-card { margin-top: 0 !important; }
      `;
      const applyEmbeddedLayout = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc?.head || !doc.body) return;
          doc.body.classList.add('facilities-embedded');
          doc.defaultView.__COMLAB_QR_SCANNER_BUTTON_INITIALIZED__ = true;
          doc.querySelectorAll('#shared-sidebar, #sidebar, #sidebarOverlay, #qr-scan-float-btn, #comlab-help-float-btn, #comlab-help-panel').forEach((element) => element.remove());
          let style = doc.getElementById('facilities-embed-layout');
          if (!style) {
            style = doc.createElement('style');
            style.id = 'facilities-embed-layout';
            style.textContent = embedStyle;
            doc.head.append(style);
          }
          if (doc.body.classList.contains('equipment-assignment-page')) {
            const assignmentTableScroll = doc.querySelector('.assignment-table-scroll');
            if (assignmentTableScroll) assignmentTableScroll.scrollTop = 0;
          }
        } catch (error) {
          console.warn('Unable to apply the embedded facilities layout.', error);
        }
      };
      const setActiveTab = (key, updateAddress = true) => {
        const route = routes[key] || routes.inventory;
        tabs.forEach((tab) => {
          const active = tab.dataset.facilitiesTab === key;
          tab.setAttribute('aria-selected', String(active));
          tab.tabIndex = active ? 0 : -1;
        });
        document.querySelector('.facilities-content').setAttribute('aria-labelledby', tabs.find((tab) => tab.dataset.facilitiesTab === key)?.id || 'inventoryTab');
        frame.title = route.title;
        frame.src = route.href;
        if (updateAddress) {
          const nextUrl = new URL(window.location.href);
          if (key === 'inventory') nextUrl.hash = '';
          else nextUrl.hash = key;
          window.history.replaceState(null, '', nextUrl);
        }
      };
      frame.addEventListener('load', applyEmbeddedLayout);
      tabs.forEach((tab) => tab.addEventListener('click', () => setActiveTab(tab.dataset.facilitiesTab)));
      document.querySelector('.facilities-header-tabs').addEventListener('keydown', (event) => {
        if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const currentIndex = tabs.indexOf(document.activeElement);
        const nextIndex = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (currentIndex + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
        tabs[nextIndex].focus();
        setActiveTab(tabs[nextIndex].dataset.facilitiesTab);
      });
      const requestedTab = window.location.hash.slice(1);
      setActiveTab(routes[requestedTab] ? requestedTab : 'inventory', false);
    })();
  </script>
