<!DOCTYPE html>

<head>

  <style>
    * { box-sizing: border-box; }
    body {

      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    .page-heading {

    .audit-page-heading {
      display: flex;

    .student-profile-header-actions {

<body class="app-shell student-portal system-layout-page student-pc-audit-page">
  <script>window.__CURRENT_USER__ = { role: 'student' };</script>
  <div id="shared-sidebar"></div>
  <main class="main-container">
    <header class="audit-page-heading" data-comlab-hide-auto-title="true">
      <button id="mobileMenuToggle" class="student-page-menu" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <div class="student-profile-header-actions header-actions" aria-label="Account actions">
        <div data-theme-toggle-anchor></div>
      </div>
    </header>
    <div class="audit-tabs" role="tablist" aria-label="Student audit history">
      <button class="audit-tab" type="button" role="tab" aria-selected="true"><i class="fas fa-desktop" aria-hidden="true"></i>PC Logs</button>
    </div>
    <section class="audit-card" aria-live="polite">
      <header class="audit-card-header">
        <div class="audit-title-wrap">
          <span class="audit-title-icon" aria-hidden="true"><i class="fas fa-clock-rotate-left"></i></span>
          <div>
            <h2>PC station log activity</h2>
            <p class="audit-subtitle">Login and logout records for your PC sessions</p>
          </div>
        </div>
        <div class="audit-filter" aria-label="Search and filter PC logs">
          <input id="studentPcLogSearch" type="search" placeholder="Search station or activity" aria-label="Search PC station or activity">
          <select id="studentPcLogActionFilter" aria-label="Filter PC logs by action">
            <option value="">All actions</option>
            <option value="login">Login</option>
            <option value="logout">Logout</option>
          </select>
          <label class="audit-filter-date"><span>From</span><input id="studentPcLogDateFrom" type="date" aria-label="Filter PC logs from date"></label>
          <label class="audit-filter-date"><span>To</span><input id="studentPcLogDateTo" type="date" aria-label="Filter PC logs to date"></label>
        </div>
      </header>
      <div class="audit-table-wrap">
        <table class="audit-table">
          <thead>
            <tr><th scope="col">Action</th><th scope="col">PC station</th><th scope="col">Date &amp; time</th></tr>
          </thead>
          <tbody id="auditHistory" aria-live="polite">
            <tr><td colspan="3" class="table-message"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>Loading PC station logs…</td></tr>
          </tbody>
        </table>
      </div>
      <footer class="audit-results">
        <span id="auditResultsSummary" aria-live="polite">Loading activity…</span>
        <nav class="audit-pagination" aria-label="PC log pages">
          <button id="auditPreviousPage" type="button" disabled>Previous</button>
          <span id="auditPageSummary">Page 1</span>
          <button id="auditNextPage" type="button" disabled>Next</button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    const auditHistory = document.getElementById('auditHistory');
    const actionFilter = document.getElementById('studentPcLogActionFilter');
    const stationSearch = document.getElementById('studentPcLogSearch');
    const dateFromFilter = document.getElementById('studentPcLogDateFrom');
    const dateToFilter = document.getElementById('studentPcLogDateTo');
    const resultsSummary = document.getElementById('auditResultsSummary');
    const pageSummary = document.getElementById('auditPageSummary');
    const previousPageButton = document.getElementById('auditPreviousPage');
    const nextPageButton = document.getElementById('auditNextPage');
    const pageSize = 25;
    let currentPage = 1;
    let totalPages = 1;
    let searchTimeout;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    const formatDate = (value, options) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? 'Date not recorded'
        : date.toLocaleString(undefined, options);
    };
    const getManilaDateBoundary = (date, endOfDay = false) =>
      `${date}T${endOfDay ? '23:59:59.999' : '00:00:00.000'}+08:00`;
    const showTableMessage = (message, icon) => {
      auditHistory.innerHTML = `<tr><td colspan="3" class="table-message"><i class="fas ${icon}" aria-hidden="true"></i>${escapeHtml(message)}</td></tr>`;
    };

    async function fetchPcLogs(params) {
      const response = await fetch('/api/audit-logs?' + params.toString(), {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Unable to load audit history.');
      if (!Array.isArray(payload.data) || !payload.meta) {
        throw new Error('The PC log service returned an unexpected response.');
      }
      return payload;
    }

    function getStationDetails(entry) {
      const description = String(entry.description || '');
      const match = description.match(/PC station (.+?) \(([^)]+)\)/i);
      return {
        name: match?.[1] || 'PC station',
        id: entry.resourceId || match?.[2] || ''
      };
    }

    function renderPcLogRows(entries) {
      if (!entries.length) {
        showTableMessage('No PC station activity matches these filters.', 'fa-inbox');
        return;
      }
      auditHistory.innerHTML = entries.map((entry) => {
        const action = String(entry.action || '').trim().toLowerCase();
        const isLogin = action === 'login';
        const actionLabel = isLogin ? 'Login' : action === 'logout' ? 'Logout' : (entry.action || 'Activity');
        const actionClass = isLogin ? 'login' : action === 'logout' ? 'logout' : '';
        const actionIcon = isLogin ? 'fa-arrow-right-to-bracket' : action === 'logout' ? 'fa-arrow-right-from-bracket' : 'fa-clock';
        const station = getStationDetails(entry);
        return `
          <tr>
            <td><span class="action-badge ${actionClass}"><i class="fas ${actionIcon}" aria-hidden="true"></i>${escapeHtml(actionLabel)}</span></td>
            <td><span class="station-name">${escapeHtml(station.name)}</span>${station.id ? `<span class="station-id">${escapeHtml(station.id)}</span>` : ''}</td>
            <td><time class="audit-time" datetime="${escapeHtml(entry.createdAt || '')}"><span>${escapeHtml(formatDate(entry.createdAt, { dateStyle: 'medium' }))}</span><span class="audit-time-date">${escapeHtml(formatDate(entry.createdAt, { timeStyle: 'short' }))}</span></time></td>
          </tr>
        `;
      }).join('');
    }

    async function loadStudentPcLogs() {
      showTableMessage('Loading PC station logs…', 'fa-spinner fa-spin');
      const params = new URLSearchParams({
        scope: 'pc-station',
        page: String(currentPage),
        pageSize: String(pageSize)
      });
      if (actionFilter.value) params.set('action', actionFilter.value);
      if (stationSearch.value.trim()) params.set('q', stationSearch.value.trim());
      if (dateFromFilter.value) params.set('dateFrom', getManilaDateBoundary(dateFromFilter.value));
      if (dateToFilter.value) params.set('dateTo', getManilaDateBoundary(dateToFilter.value, true));
      if (dateFromFilter.value && dateToFilter.value && dateFromFilter.value > dateToFilter.value) {
        showTableMessage('The start date must be on or before the end date.', 'fa-calendar-xmark');
        resultsSummary.textContent = 'Check the selected date range.';
        return;
      }

      try {
        const payload = await fetchPcLogs(params);
        totalPages = Math.max(1, Number(payload.meta.totalPages) || 1);
        const total = Number(payload.meta.total) || 0;
        renderPcLogRows(payload.data);
        const firstResult = total ? (currentPage - 1) * pageSize + 1 : 0;
        const lastResult = Math.min(currentPage * pageSize, total);
        resultsSummary.textContent = total
          ? `Showing ${firstResult}–${lastResult} of ${total} PC station logs`
          : 'No PC station logs found.';
        pageSummary.textContent = `Page ${currentPage} of ${totalPages}`;
        previousPageButton.disabled = currentPage <= 1;
        nextPageButton.disabled = currentPage >= totalPages;
      } catch (error) {
        console.error('Failed to load student audit history:', error);
        showTableMessage(error.message || 'Unable to load audit history. Please try again.', 'fa-triangle-exclamation');
        resultsSummary.textContent = 'PC station logs could not be loaded.';
        pageSummary.textContent = 'Page 1';
        previousPageButton.disabled = true;
        nextPageButton.disabled = true;
      }
    }

    function resetAndLoadPcLogs() {
      currentPage = 1;
      loadStudentPcLogs();
    }

    function syncDateFilterLimits() {
      dateToFilter.min = dateFromFilter.value;
      dateFromFilter.max = dateToFilter.value;
    }

    actionFilter.addEventListener('change', resetAndLoadPcLogs);
    dateFromFilter.addEventListener('change', () => {
      syncDateFilterLimits();
      resetAndLoadPcLogs();
    });
    dateToFilter.addEventListener('change', () => {
      syncDateFilterLimits();
      resetAndLoadPcLogs();
    });
    stationSearch.addEventListener('input', () => {
      window.clearTimeout(searchTimeout);
      searchTimeout = window.setTimeout(resetAndLoadPcLogs, 250);
    });
    previousPageButton.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        loadStudentPcLogs();
      }
    });
    nextPageButton.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage += 1;
        loadStudentPcLogs();
      }
    });
    loadStudentPcLogs();
  </script>
</body>
</html>
