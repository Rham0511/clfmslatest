    </header>
    <section class="audit-overview" aria-label="Student audit history overview">
      <span class="audit-overview-icon" aria-hidden="true"><i class="fas fa-shield-halved"></i></span>
      <div class="audit-overview-copy">
        <p class="audit-overview-kicker">Student account</p>
        <h1>Audit History</h1>
        <p class="audit-overview-description">Review your system access, equipment activity, and PC station sessions.</p>
      </div>
      <span class="audit-overview-note"><i class="fas fa-lock" aria-hidden="true"></i>Private to your account</span>
    </section>
    <div class="audit-tabs" role="tablist" aria-label="Student audit history">
      <button class="audit-tab" type="button" role="tab" aria-selected="true" data-category="pc-station"><i class="fas fa-desktop" aria-hidden="true"></i>PC Logs</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="all"><i class="fas fa-list-check" aria-hidden="true"></i>All Activity</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="access"><i class="fas fa-right-to-bracket" aria-hidden="true"></i>System Access</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="profile"><i class="fas fa-user-pen" aria-hidden="true"></i>Profile Updates</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="scans"><i class="fas fa-qrcode" aria-hidden="true"></i>Item QR Scans</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="borrow"><i class="fas fa-box-open" aria-hidden="true"></i>Borrowing</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="reports"><i class="fas fa-screwdriver-wrench" aria-hidden="true"></i>Issue Reports</button>
      <button class="audit-tab" type="button" role="tab" aria-selected="false" data-category="security"><i class="fas fa-shield-halved" aria-hidden="true"></i>Account Security</button>
    </div>
    <section class="audit-card" aria-live="polite">
      <header class="audit-card-header">
        <div class="audit-title-wrap">
          <span class="audit-title-icon" aria-hidden="true"><i id="auditTitleIcon" class="fas fa-desktop"></i></span>
          <div>
            <h2 id="auditTitle">PC station logs</h2>
            <p id="auditSubtitle" class="audit-subtitle">Sign-ins and sign-outs at your PC workstations.</p>
          </div>
        </div>
        <div class="audit-filter" aria-label="Search and filter student activity">
          <label class="audit-search"><i class="fas fa-magnifying-glass" aria-hidden="true"></i><input id="studentAuditSearch" type="search" placeholder="Search activity or details" aria-label="Search activity or details"></label>
          <label class="audit-filter-date"><span>From</span><input id="studentAuditDateFrom" type="date" aria-label="Filter activity from date"></label>
          <label class="audit-filter-date"><span>To</span><input id="studentAuditDateTo" type="date" aria-label="Filter activity to date"></label>
        </div>
      </header>
      <div class="audit-table-wrap">
        <table class="audit-table">
          <thead>
            <tr><th scope="col">Activity</th><th scope="col">Details</th><th scope="col">Date &amp; time</th></tr>
          </thead>
          <tbody id="auditHistory" aria-live="polite">
            <tr><td colspan="3" class="table-message"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>Loading activity…</td></tr>
          </tbody>
        </table>
      </div>
      <footer class="audit-results">
        <span id="auditResultsSummary" aria-live="polite">Loading activity…</span>
        <nav class="audit-pagination" aria-label="Activity pages">
          <button id="auditPreviousPage" type="button" disabled>Previous</button>
          <span id="auditPageSummary">Page 1</span>
          <button id="auditNextPage" type="button" disabled>Next</button>
        </nav>
      </footer>
    </section>
  </main>

  <script>
    const auditHistory = document.getElementById('auditHistory');
    const searchInput = document.getElementById('studentAuditSearch');
    const dateFromFilter = document.getElementById('studentAuditDateFrom');
    const dateToFilter = document.getElementById('studentAuditDateTo');
    const resultsSummary = document.getElementById('auditResultsSummary');
    const pageSummary = document.getElementById('auditPageSummary');
    const previousPageButton = document.getElementById('auditPreviousPage');
    const nextPageButton = document.getElementById('auditNextPage');
    const title = document.getElementById('auditTitle');
    const subtitle = document.getElementById('auditSubtitle');
    const titleIcon = document.getElementById('auditTitleIcon');
    const tabs = [...document.querySelectorAll('.audit-tab[data-category]')];
    const pageSize = 25;
    const dataCache = new Map();
    const tabCopy = {
      all: ['All student activity', 'Your account activity, item scans, requests, and PC sessions.', 'fa-list-check'],
      access: ['System access', 'Sign-ins and sign-outs from your ComLab account.', 'fa-right-to-bracket'],
      profile: ['Profile updates', 'Changes saved to your student profile.', 'fa-user-pen'],
      scans: ['Item QR scans', 'Equipment QR codes scanned by your account.', 'fa-qrcode'],
      borrow: ['Borrowing activity', 'Borrow requests, approvals, returns, and QR handoffs.', 'fa-box-open'],
      reports: ['Issue reports', 'Maintenance and equipment issues reported by you.', 'fa-screwdriver-wrench'],
      security: ['Account security', 'Email verification, password resets, and other security events.', 'fa-shield-halved'],
      'pc-station': ['PC station logs', 'Sign-ins and sign-outs at your PC workstations.', 'fa-desktop']
    };
    let activeCategory = 'pc-station';
    let currentPage = 1;
    let totalPages = 1;
    let requestVersion = 0;
    let searchTimeout;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    const formatDate = (value, options) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime())
        ? 'Date not recorded'
        : date.toLocaleString(undefined, options);
    };
    const manilaDateKey = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Manila', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date).reduce((result, part) => {
        if (part.type !== 'literal') result[part.type] = part.value;
        return result;
      }, {});
      return `${parts.year}-${parts.month}-${parts.day}`;
    };
    const showTableMessage = (message, icon) => {
      auditHistory.innerHTML = `<tr><td colspan="3" class="table-message"><i class="fas ${icon}" aria-hidden="true"></i>${escapeHtml(message)}</td></tr>`;
    };

    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { Accept: 'application/json' }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Unable to load your audit history.');
      return payload;
    }

    async function fetchAuditCategory(category) {
      const params = new URLSearchParams({ scope: 'student-activity', category, exportAll: 'true', pageSize: '5000' });
      const payload = await fetchJson('/api/audit-logs?' + params.toString());
      if (!Array.isArray(payload.data)) throw new Error('The activity service returned an unexpected response.');
      return payload.data.map((entry) => ({
        id: `audit-${entry.id}`,
        action: entry.action || 'Activity',
        module: entry.module || 'ComLab',
        details: entry.description || entry.module || 'Activity recorded',
        timestamp: entry.createdAt,
        source: 'audit'
      }));
    }

    async function fetchPcEntries() {
      const params = new URLSearchParams({ scope: 'pc-station', exportAll: 'true', pageSize: '5000' });
      const payload = await fetchJson('/api/audit-logs?' + params.toString());
      if (!Array.isArray(payload.data)) throw new Error('The PC log service returned an unexpected response.');
      return payload.data.map((entry) => {
        const description = String(entry.description || '');
        const match = description.match(/PC station (.+?) \(([^)]+)\)/i);
        const stationName = match?.[1] || 'PC station';
        const stationId = entry.resourceId || match?.[2] || '';
        return {
          id: `pc-${entry.id}`,
          action: `PC ${String(entry.action || 'activity').toLowerCase()}`,
          module: 'PC station',
          details: `${stationName}${stationId ? ` (${stationId})` : ''}`,
          timestamp: entry.createdAt,
          source: 'pc'
        };
      });
    }

    async function fetchScanEntries() {
      const payload = await fetchJson('/api/equipment-scan-history');
      if (!Array.isArray(payload.data)) throw new Error('The item scan service returned an unexpected response.');
      return payload.data
        .filter((entry) => entry.actionType === 'equipment_scanned')
        .map((entry) => ({
          id: `scan-${entry.id}`,
          action: 'Item QR scanned',
          module: 'Equipment',
          details: entry.equipmentName
            ? `${entry.equipmentName}${entry.equipmentAssetId ? ` (${entry.equipmentAssetId})` : ''}`
            : (entry.actionDescription || 'Equipment QR code scanned'),
          timestamp: entry.actionTimestamp,
          source: 'scan'
        }));
    }

    async function loadCategoryData(category) {
      if (dataCache.has(category)) return dataCache.get(category);
      let entries;
      if (category === 'scans') {
        entries = await fetchScanEntries();
      } else if (category === 'pc-station') {
        entries = await fetchPcEntries();
      } else if (category === 'all') {
        const [audits, scans, pcEntries] = await Promise.all([
          fetchAuditCategory('all'), fetchScanEntries(), fetchPcEntries()
        ]);
        entries = [...audits, ...scans, ...pcEntries];
      } else {
        entries = await fetchAuditCategory(category);
      }
      entries.sort((left, right) => new Date(right.timestamp || 0) - new Date(left.timestamp || 0));
      dataCache.set(category, entries);
      return entries;
    }

    function filterEntries(entries) {
      const term = searchInput.value.trim().toLocaleLowerCase();
      const from = dateFromFilter.value;
      const to = dateToFilter.value;
      return entries.filter((entry) => {
        const searchable = `${entry.action} ${entry.module} ${entry.details}`.toLocaleLowerCase();
        if (term && !searchable.includes(term)) return false;
        const dateKey = manilaDateKey(entry.timestamp);
        if (from && (!dateKey || dateKey < from)) return false;
        if (to && (!dateKey || dateKey > to)) return false;
        return true;
      });
    }

    function getDisplayDetails(entry) {
      const details = String(entry.details || '').trim();
      const action = String(entry.action || '').toLocaleLowerCase();

      if (entry.module === 'Authentication' && action === 'login') {
        return details.match(/^User (.+?) logged in successfully\.?$/i)?.[1] || details;
      }
      if (entry.module === 'Authentication' && action === 'logout') {
        return details.match(/^User (.+?) logged out\.?$/i)?.[1] || details;
      }
      if (action.includes('cancel')) {
        return details.replace(/^(?:Student|User .+?|Technician) cancel(?:led|ed)\s+/i, '');
      }
      if (action.includes('created')) {
        return details.replace(/^(?:Maintenance request|Issue report) created\s+(?:for\s+)?/i, '');
      }
      return details;
    }

    function shouldShowModule(entry) {
      const module = String(entry.module || '').toLocaleLowerCase();
      const action = String(entry.action || '').toLocaleLowerCase();
      if (entry.source === 'pc' || entry.source === 'scan') return false;
      if (['authentication', 'pc station', 'equipment'].includes(module)) return false;
      if (module === 'maintenance monitoring' && /maintenance|request|report|issue/.test(action)) return false;
      if (module === 'borrow management' && /borrow|return/.test(action)) return false;
      if (module === 'user management' && /profile|user updated/.test(action)) return false;
      return Boolean(entry.module);
    }

    function renderRows(entries) {
      if (!entries.length) {
        showTableMessage('No activity matches these filters.', 'fa-inbox');
        return;
      }
      auditHistory.innerHTML = entries.map((entry) => {
        const lowerAction = String(entry.action || '').toLowerCase();
        const actionClass = lowerAction.includes('login') ? 'login' : lowerAction.includes('logout') ? 'logout' : '';
        const actionIcon = entry.source === 'scan' ? 'fa-qrcode'
          : lowerAction.includes('login') ? 'fa-arrow-right-to-bracket'
            : lowerAction.includes('logout') ? 'fa-arrow-right-from-bracket'
              : 'fa-clock';
        const moduleLabel = shouldShowModule(entry)
          ? `<span class="station-id">${escapeHtml(entry.module)}</span>`
          : '';
        return `
          <tr>
            <td><span class="action-badge ${actionClass}"><i class="fas ${actionIcon}" aria-hidden="true"></i>${escapeHtml(entry.action)}</span></td>
            <td><span class="station-name">${escapeHtml(getDisplayDetails(entry))}</span>${moduleLabel}</td>
            <td><time class="audit-time" datetime="${escapeHtml(entry.timestamp || '')}"><span>${escapeHtml(formatDate(entry.timestamp, { dateStyle: 'medium' }))}</span><span class="audit-time-date">${escapeHtml(formatDate(entry.timestamp, { timeStyle: 'short' }))}</span></time></td>
          </tr>
        `;
      }).join('');
    }

    function renderPage(filteredEntries) {
      totalPages = Math.max(1, Math.ceil(filteredEntries.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const pageEntries = filteredEntries.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      renderRows(pageEntries);
      const firstResult = filteredEntries.length ? (currentPage - 1) * pageSize + 1 : 0;
      const lastResult = Math.min(currentPage * pageSize, filteredEntries.length);
      resultsSummary.textContent = filteredEntries.length
        ? `Showing ${firstResult}–${lastResult} of ${filteredEntries.length} activities`
        : 'No activity found.';
      pageSummary.textContent = `Page ${currentPage} of ${totalPages}`;
      previousPageButton.disabled = currentPage <= 1;
      nextPageButton.disabled = currentPage >= totalPages;
    }

    async function loadActiveCategory() {
      const thisRequest = ++requestVersion;
      const [heading, description, icon] = tabCopy[activeCategory];
      title.textContent = heading;
      subtitle.textContent = description;
      titleIcon.className = `fas ${icon}`;
      showTableMessage('Loading activity…', 'fa-spinner fa-spin');
      resultsSummary.textContent = 'Loading activity…';

      if (dateFromFilter.value && dateToFilter.value && dateFromFilter.value > dateToFilter.value) {
        showTableMessage('The start date must be on or before the end date.', 'fa-calendar-xmark');
        resultsSummary.textContent = 'Check the selected date range.';
        return;
      }

      try {
        const allEntries = await loadCategoryData(activeCategory);
        if (thisRequest !== requestVersion) return;
        renderPage(filterEntries(allEntries));
      } catch (error) {
        if (thisRequest !== requestVersion) return;
        console.error('Failed to load student audit history:', error);
        showTableMessage(error.message || 'Unable to load activity. Please try again.', 'fa-triangle-exclamation');
        resultsSummary.textContent = 'Activity could not be loaded.';
        pageSummary.textContent = 'Page 1 of 1';
        previousPageButton.disabled = true;
        nextPageButton.disabled = true;
      }
    }

    function resetAndRender() {
      currentPage = 1;
      loadActiveCategory();
    }

    function syncDateFilterLimits() {
      dateToFilter.min = dateFromFilter.value;
      dateFromFilter.max = dateToFilter.value;
    }

    tabs.forEach((tab) => tab.addEventListener('click', () => {
      activeCategory = tab.dataset.category;
      tabs.forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
      currentPage = 1;
      loadActiveCategory();
    }));
    dateFromFilter.addEventListener('change', () => {
      syncDateFilterLimits();
      resetAndRender();
    });
    dateToFilter.addEventListener('change', () => {
      syncDateFilterLimits();
      resetAndRender();
    });
    searchInput.addEventListener('input', () => {
      window.clearTimeout(searchTimeout);
      searchTimeout = window.setTimeout(resetAndRender, 180);
    });
    previousPageButton.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        loadActiveCategory();
      }
    });
    nextPageButton.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage += 1;
        loadActiveCategory();
      }
    });
    loadActiveCategory();
  </script>
</body>
</html>
