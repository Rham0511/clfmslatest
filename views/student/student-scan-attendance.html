<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance | ComLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/sidebar.css?v=70">
    <style>
        body { 
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); 
            min-height: 100vh; 
        }
        .schedule-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .schedule-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
        }
        .schedule-card.active {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(5, 150, 105, 0.1));
        }
        .schedule-card.closed {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .schedule-card.not-yet-open {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.05));
        }
        body.student-portal.student-attendance-page .student-page-subtitle {
            display: block;
            margin: 0.12rem 0 0;
            color: #a7f3d0 !important;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.15;
        }
        body.student-portal.student-attendance-page .student-university-title {
            color: #fff;
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.25;
        }
        html.theme-light body.student-portal.student-attendance-page .main-container.theme-light .student-university-title {
            color: #000 !important;
        }
        body.student-portal.student-attendance-page #emptyState > i {
            font-size: clamp(2.5rem, 8vw, 4rem);
        }
        body.student-portal.student-attendance-page #emptyState > p {
            color: #f3f4f6;
            font-size: 1rem;
            font-weight: 600;
        }
        html.theme-light body.student-portal.student-attendance-page .main-container.theme-light #emptyState > i {
            color: #046a38;
        }
        html.theme-light body.student-portal.student-attendance-page .main-container.theme-light #emptyState > p {
            color: #111827;
        }
        .attendance-header-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 0.55rem;
            margin-left: auto;
        }
        body.student-portal.student-attendance-page .attendance-about,
        body.student-portal.student-attendance-page [data-attendance-about],
        body.student-portal.student-attendance-page [id*="attendance-about" i] {
            display: none !important;
        }

        @media (max-width: 640px) {
            body.student-portal .page-content {
                padding: 1rem !important;
            }

            .attendance-page-heading {
                gap: 0.85rem;
                margin-bottom: 1rem;
                padding: 1.1rem;
                border-radius: 1.25rem;
            }

            .attendance-page-heading .attendance-heading-icon {
                padding: 0.8rem;
            }

            .attendance-page-heading h1 {
                font-size: 1.5rem;
                line-height: 1.2;
            }

            #loadingState,
            #errorState,
            #emptyState {
                padding: 1.5rem 0.85rem !important;
            }

            #loadingState > i,
            #errorState > i,
            #emptyState > i {
                margin-bottom: 0.65rem;
                font-size: 2rem;
            }

            #loadingState > p,
            #errorState > p,
            #emptyState > p {
                font-size: 0.88rem;
                line-height: 1.45;
            }

            #schedulesGrid {
                gap: 0.75rem;
            }

            .schedule-card {
                padding: 0.85rem !important;
                border-radius: 0.9rem;
            }

            .schedule-card > .flex.items-start.justify-between {
                gap: 0.65rem;
                margin-bottom: 0.75rem;
            }

            .schedule-card h3 {
                font-size: 0.95rem;
                line-height: 1.3;
            }

            .schedule-card .flex.flex-col.items-end > span {
                gap: 0.3rem;
                padding: 0.3rem 0.55rem;
                font-size: 0.65rem;
            }

            .schedule-card p {
                font-size: 0.76rem;
                line-height: 1.35;
            }

            .schedule-card .schedule-meta {
                flex-wrap: wrap;
                gap: 0.45rem 0.75rem;
                padding-top: 0.65rem;
                font-size: 0.72rem;
            }

            .schedule-card .schedule-meta span {
                display: inline-flex;
                align-items: center;
            }
        }

        @media (max-width: 380px) {
            .schedule-card > .flex.items-start.justify-between {
                flex-direction: column;
            }

            .schedule-card .flex.flex-col.items-end {
                width: 100%;
                align-items: flex-start;
            }
        }
    </style>
  <link rel="stylesheet" href="/css/table-readability.css?v=1">
<link rel="stylesheet" href="/css/system-layout.css?v=8">
    <link rel="stylesheet" href="/css/student-ui-polish.css?v=1">
</head>
<body class="app-shell student-portal system-layout-page student-attendance-page">
    <script>window.__CURRENT_USER__ = __CURRENT_USER_JSON__;</script>
    <div id="shared-sidebar"></div>
    
    <div class="main-container">
        <div class="page-content" style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
            <!-- Header -->
            <div class="student-page-header attendance-page-heading">
                <div class="student-page-heading">
                    <button id="mobileMenuToggle" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">
                        <i class="fas fa-bars" aria-hidden="true"></i>
                    </button>
                    <div class="student-page-heading-copy">
                        <h1 class="student-page-title student-university-title">MINDORO STATE UNIVERSITY</h1>
                    </div>
                </div>
                <div class="attendance-header-actions" data-theme-toggle-anchor>
                    <div class="student-page-user">
                        <span class="student-page-user-initials" data-user-initials>ST</span>
                        <span class="student-page-user-role" data-user-role>Student</span>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <i class="fas fa-spinner fa-spin text-5xl text-emerald-400 mb-4"></i>
                <p class="text-white text-lg">Loading available schedules...</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden bg-red-900/40 backdrop-blur-sm rounded-2xl p-8 border border-red-500/30 text-center">
                <i class="fas fa-exclamation-triangle text-5xl text-red-400 mb-4"></i>
                <p id="errorMessage" class="text-red-200 text-lg"></p>
            </div>

            <!-- Schedules Grid -->
            <div id="schedulesGrid" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Schedules will be rendered here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <i class="fas fa-calendar-times text-6xl text-slate-500 mb-4"></i>
                <p class="text-slate-300 text-lg">No active schedules available at this time</p>
            </div>
        </div>
    </div>

    <script src="/js/student-sidebar-config.js?v=30"></script>
    <script src="/js/sidebar-component.js?v=68" defer></script>
    <script>
        async function loadSchedules() {
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const schedulesGrid = document.getElementById('schedulesGrid');
            const emptyState = document.getElementById('emptyState');

            try {
                // Get current user session
                const response = await fetch('/api/laboratory-schedules');
                if (!response.ok) throw new Error('Failed to load schedules');

                const schedules = await response.json();
                
                loadingState.classList.add('hidden');

                if (!schedules || schedules.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Filter to today's schedules
                const today = new Date().toLocaleLowerString('en-US', { weekday: 'long' });
                const todaySchedules = schedules.filter(s => 
                    s.dayOfWeek?.toLowerCase() === today.toLowerCase()
                );

                if (todaySchedules.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                schedulesGrid.classList.remove('hidden');
                schedulesGrid.innerHTML = todaySchedules.map(schedule => {
                    const status = getScheduleStatus(schedule);
                    const statusConfig = {
                        active: { 
                            icon: 'fa-circle-check', 
                            color: 'text-emerald-400', 
                            label: 'Open Now',
                            class: 'active'
                        },
                        'not-yet-open': { 
                            icon: 'fa-clock', 
                            color: 'text-amber-400', 
                            label: 'Not Yet Open',
                            class: 'not-yet-open'
                        },
                        closed: { 
                            icon: 'fa-lock', 
                            color: 'text-slate-400', 
                            label: 'Closed',
                            class: 'closed'
                        }
                    };

                    const config = statusConfig[status] || statusConfig.closed;
                    const clickable = status === 'active' || status === 'not-yet-open';

                    return `
                        <div class="schedule-card ${config.class} bg-slate-900/80 backdrop-blur-sm rounded-xl border-2 p-6 ${!clickable ? 'closed' : ''}"
                             ${clickable ? `onclick="selectSchedule(${schedule.id})"` : ''}>
                            <div class="flex items-start justify-between mb-4">
                                <div class="flex-1">
                                    <h3 class="text-xl font-bold text-white mb-2">${schedule.subject || 'Lab Session'}</h3>
                                    <p class="text-slate-300 text-sm mb-1">
                                        <i class="fas fa-user-tie mr-2"></i>${schedule.instructor || 'No instructor'}
                                    </p>
                                    <p class="text-slate-300 text-sm">
                                        <i class="fas fa-door-open mr-2"></i>${schedule.laboratoryRoom || 'N/A'}
                                    </p>
                                </div>
                                <div class="flex flex-col items-end gap-2">
                                    <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-semibold ${config.color} bg-slate-800/60">
                                        <i class="fas ${config.icon}"></i>
                                        ${config.label}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="schedule-meta flex items-center gap-4 text-sm text-slate-400 pt-4 border-t border-slate-700">
                                <span><i class="fas fa-clock mr-2"></i>${schedule.startTime} - ${schedule.endTime}</span>
                                <span><i class="fas fa-calendar mr-2"></i>${schedule.dayOfWeek}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading schedules:', error);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                document.getElementById('errorMessage').textContent = error.message || 'Failed to load schedules';
            }
        }

        function getScheduleStatus(schedule) {
            // Simplified status check - you can make this more sophisticated
            const now = new Date();
            const currentTime = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });

            // Very basic time comparison - assumes times are in same format
            if (schedule.startTime && schedule.endTime) {
                // For demo purposes, consider most schedules "active"
                return 'active';
            }

            return 'active';
        }

        async function selectSchedule(scheduleId) {
            try {
                // Redirect to attendance recording with schedule ID
                window.location.href = `/attendance/record?scheduleId=${scheduleId}`;
            } catch (error) {
                console.error('Error selecting schedule:', error);
                alert('Failed to record attendance. Please try again.');
            }
        }

        function hideAttendanceAboutSections() {
            const content = document.querySelector('body.student-attendance-page .page-content');
            if (!content) return;

            const aboutLabels = content.querySelectorAll('h1, h2, h3, h4, h5, h6, [role="heading"], [role="tab"], button, a');
            aboutLabels.forEach((label) => {
                const text = String(label.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
                if (!['about', 'about attendance', 'attendance about'].includes(text)) return;

                const panelId = label.getAttribute('aria-controls') || String(label.getAttribute('data-target') || '').replace(/^#/, '');
                const panel = panelId ? document.getElementById(panelId) : null;
                if (panel && content.contains(panel)) panel.hidden = true;

                const aboutSection = label.closest(
                    '[data-attendance-about], .attendance-about, [class*="about-attendance" i], [id*="attendance-about" i], section, article, aside, [class*="-card" i]'
                );
                if (aboutSection && content.contains(aboutSection)) {
                    aboutSection.hidden = true;
                } else if (label.matches('h1, h2, h3, h4, h5, h6, [role="heading"]') && label.parentElement && label.parentElement !== content) {
                    label.parentElement.hidden = true;
                } else {
                    label.hidden = true;
                }
            });
        }

        function initializeAttendanceAboutVisibility() {
            const content = document.querySelector('body.student-attendance-page .page-content');
            if (!content) return;
            hideAttendanceAboutSections();
            const observer = new MutationObserver(hideAttendanceAboutSections);
            observer.observe(content, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeAttendanceAboutVisibility, { once: true });
        } else {
            initializeAttendanceAboutVisibility();
        }

        // Load schedules on page load
        document.addEventListener('DOMContentLoaded', loadSchedules);
    </script>
</body>
</html>
