<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PC Station | ComLab Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/sidebar.css?v=75">
    <style>
        :root {
            --accent: #22C55E;
            --accent-strong: #16A34A;
            --accent-soft: rgba(34,197,94,.12);
            --border: rgba(34,197,94,.15);
            --shadow: 0 12px 35px rgba(6,64,43,.18);
            --shadow-hover: 0 18px 40px rgba(34,197,94,.18);
        }

        body {
            background:
                radial-gradient(circle at top left, rgba(34,197,94,.16), transparent 24%),
                radial-gradient(circle at bottom right, rgba(74,222,128,.10), transparent 26%),
                linear-gradient(180deg, #020617 0%, #07111f 100%);
            color: #f8fafc;
            font-family: Inter, 'Segoe UI', Roboto, sans-serif;
        }

        body.student-portal {
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.student-portal .main-container {
            min-height: 100vh;
            height: auto;
            display: flex;
            flex-direction: column;
            overflow: visible;
        }

        .main-container {
            min-height: 100vh;
            background: transparent;
        }

        .glass-card {
            background: linear-gradient(180deg, rgba(7, 17, 31,.96), rgba(2, 6, 23,.96));
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px) saturate(1.04);
        }

        body.student-portal .main-container > .top-header {
            display: flex !important;
            justify-content: center !important;
            padding: 0 !important;
            margin: 1rem 1rem 0 !important;
            width: calc(100% - 2rem) !important;
            max-width: 100% !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .top-header-card {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(15, 79, 60, 0.35);
            background: rgba(7, 17, 31, 0.92);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(20px) saturate(1.08);
            overflow: hidden;
            position: relative;
            margin-bottom: 1.5rem;
        }

        .pc-station-header-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 0.55rem;
            margin-left: auto;
        }

        body.pc-station-page .student-page-heading-copy {
            margin-left: 0.75rem;
        }

        body.student-portal.pc-station-page .student-page-subtitle {
            color: #a7f3d0 !important;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .top-header-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.04), transparent 45%);
            pointer-events: none;
        }

        .top-header-card .header-meta {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .header-subtitle {
            color: #cbd5e1;
            font-size: 0.98rem;
        }

        .pc-session-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .8rem;
            margin-bottom: .85rem;
        }

        .pc-scan-copy {
            display: flex;
            align-items: center;
            gap: .9rem;
            min-width: 0;
        }

        .pc-scan-icon {
            display: grid;
            width: 2.8rem;
            height: 2.8rem;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid rgba(74, 222, 128, .22);
            border-radius: .85rem;
            background: rgba(16, 185, 129, .12);
            color: #6ee7b7;
            font-size: 1.2rem;
        }

        .pc-scan-copy h2 {
            margin: 0;
            color: #e8f7ee;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .pc-scan-copy p {
            margin: .2rem 0 0;
            color: #a7c2b2;
            font-size: .78rem;
            line-height: 1.45;
        }

        .pc-session-list {
            display: grid;
            gap: .6rem;
        }

        .pc-session-item,
        .pc-session-empty {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .8rem;
            padding: .8rem .9rem;
            border: 1px solid rgba(74, 222, 128, .16);
            border-radius: .9rem;
            background: rgba(3, 20, 13, .42);
        }

        .pc-session-item-copy {
            display: grid;
            min-width: 0;
            gap: .14rem;
        }

        .pc-session-item-copy strong {
            color: #e8f7ee;
            font-size: .94rem;
        }

        .pc-session-item-copy span {
            color: #a7c2b2;
            font-size: .74rem;
            line-height: 1.4;
        }

        .pc-session-empty {
            justify-content: flex-start;
            color: #a7c2b2;
            font-size: .82rem;
            line-height: 1.5;
        }

        .pc-session-empty i { color: #6ee7b7; }

        .pc-session-logout {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            min-height: 2.4rem;
            padding: .5rem .75rem;
            border: 1px solid rgba(251, 191, 36, .3);
            border-radius: .75rem;
            background: rgba(245, 158, 11, .1);
            color: #fcd34d;
            font-size: .76rem;
            font-weight: 750;
            cursor: pointer;
        }

        .pc-session-logout:disabled { cursor: wait; opacity: .65; }

        .pc-session-feedback {
            min-height: 1.15rem;
            margin-top: .45rem;
            color: #fca5a5;
            font-size: .76rem;
        }

        .pc-logs-link {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            min-height: 2.65rem;
            padding: .65rem .9rem;
            border: 1px solid rgba(74, 222, 128, .28);
            border-radius: .8rem;
            background: rgba(34, 197, 94, .12);
            color: #a7f3d0;
            font-size: .82rem;
            font-weight: 700;
            text-decoration: none;
            transition: background .18s ease, border-color .18s ease;
        }

        .pc-logs-link:hover {
            border-color: rgba(74, 222, 128, .5);
            background: rgba(34, 197, 94, .2);
        }

        .usage-history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .usage-history-scroll {
            max-height: 30rem;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            scrollbar-color: rgba(52, 211, 153, 0.45) rgba(6, 24, 17, 0.65);
            scrollbar-width: thin;
        }

        .usage-history-table thead {
            background: linear-gradient(180deg, rgba(18,49,36,.95), rgba(20,59,42,.95));
        }

        .usage-history-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 0.9rem 1rem;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #94a3b8;
            text-align: left;
        }

        .usage-history-table td {
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            color: #f8fafc;
            border-top: 1px solid rgba(74,222,128,.1);
        }

        .usage-history-cell-label {
            display: none;
        }

        .pc-error {
            padding: 1rem;
            border-radius: 0.75rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            text-align: center;
        }

        @media (max-width: 640px) {
            body.student-portal .main-container > .top-header {
                margin: 0.75rem 0.75rem 0 !important;
                width: calc(100% - 1.5rem) !important;
            }

            .top-header-card {
                padding: 1rem 1rem 1rem 4rem;
                border-radius: 1.25rem;
                margin-bottom: 0.25rem;
            }

            .header-title {
                font-size: clamp(1.35rem, 6vw, 1.75rem);
            }

            .header-subtitle {
                font-size: 0.9rem;
                line-height: 1.45;
            }

            body.student-portal .main-container > main {
                gap: 0.85rem;
                padding: 0.75rem !important;
            }

            body.student-portal #pcScanInfo,
            body.student-portal #pcScanInfo + section {
                border-radius: 1.25rem;
                padding: 1rem !important;
            }

            .pc-session-heading {
                align-items: flex-start;
            }

            .pc-scan-copy { gap: .65rem; }
            .pc-scan-icon { width: 2.4rem; height: 2.4rem; }
            .pc-scan-copy h2 { font-size: 1rem; }

            .pc-session-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .pc-session-logout { width: 100%; }

            .usage-history-table,
            .usage-history-table tbody {
                display: block;
                width: 100%;
            }

            .usage-history-scroll {
                max-height: 55vh;
                border-radius: 0.75rem;
            }

            .usage-history-table thead {
                display: none;
            }

            .usage-history-table tbody {
                display: grid;
                gap: 0.5rem;
            }

            .usage-history-table tr {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-areas:
                    "pc duration"
                    "subject subject"
                    "instructor lab"
                    "started ended";
                gap: 0.08rem 0.55rem;
                padding: 0.5rem 0.6rem;
                border: 1px solid rgba(74,222,128,.15);
                border-radius: 0.75rem;
                background: linear-gradient(135deg, rgba(12,38,27,.72), rgba(8,24,18,.78));
            }

            .usage-history-table td {
                display: grid;
                grid-template-columns: 4.2rem minmax(0, 1fr);
                align-items: baseline;
                min-width: 0;
                gap: 0.25rem;
                padding: 0.28rem 0.1rem;
                border: 0;
                font-size: 0.72rem;
                overflow-wrap: anywhere;
            }

            .usage-history-table td:nth-child(1) { grid-area: pc; }
            .usage-history-table td:nth-child(2) {
                grid-area: subject;
                padding-top: 0.32rem;
                padding-bottom: 0.32rem;
                border-top: 1px solid rgba(74,222,128,.09);
                border-bottom: 1px solid rgba(74,222,128,.09);
            }
            .usage-history-table td:nth-child(3) { grid-area: instructor; }
            .usage-history-table td:nth-child(4) { grid-area: lab; }
            .usage-history-table td:nth-child(5) { grid-area: started; }
            .usage-history-table td:nth-child(6) { grid-area: ended; }
            .usage-history-table td:nth-child(7) { grid-area: duration; }

            .usage-history-cell-label {
                display: block;
                color: #86a998;
                font-size: 0.56rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            .usage-history-value {
                min-width: 0;
                color: #e8f4ed;
                line-height: 1.35;
            }

            .usage-history-table td small {
                color: #9db4a7;
                font-size: 0.66rem;
                white-space: normal;
            }

            .usage-history-table td:nth-child(1) .usage-history-value,
            .usage-history-table td:nth-child(7) .usage-history-value {
                color: #d1fae5;
                font-weight: 700;
            }
        }

        @media (max-width: 1023px) {
            body.student-portal.pc-station-page .student-page-subtitle {
                font-size: 0.46rem !important;
                letter-spacing: 0.08em;
            }

            body.student-portal.pc-station-page #pcScanInfo,
            body.student-portal.pc-station-page #pcScanInfo + section {
                padding: 0.9rem !important;
                border-radius: 1.1rem;
            }

            body.student-portal.pc-station-page #pcScanInfo + section h2 {
                margin-bottom: 0.8rem;
                font-size: 1.15rem;
            }
        }

    </style>

    <style>
        /* Compact mobile history with full details in a bottom sheet. */
        .usage-history-mobile-date,
        .usage-history-mobile-chevron { display: none; }
        .pc-history-detail-backdrop {
            position: fixed; z-index: 1200; inset: 0; display: grid; align-items: end;
            background: rgba(5, 18, 12, .48); opacity: 0; transition: opacity .18s ease;
        }
        .pc-history-detail-backdrop.is-open { opacity: 1; }
        .pc-history-detail-sheet {
            width: min(100%, 34rem); max-height: 82vh; margin: 0 auto; overflow: auto;
            border: 1px solid #cbded1; border-bottom: 0; border-radius: 1.25rem 1.25rem 0 0;
            background: #f7fbf8; color: #173326; transform: translateY(100%); transition: transform .18s ease;
        }
        .pc-history-detail-backdrop.is-open .pc-history-detail-sheet { transform: translateY(0); }
        .pc-history-detail-handle { width: 2.8rem; height: .3rem; margin: .6rem auto .2rem; border-radius: 99px; background: #b7cfc0; }
        .pc-history-detail-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 1rem .8rem; border-bottom: 1px solid #dce8df; }
        .pc-history-detail-header h2 { margin: 0; font-size: 1.1rem; font-weight: 800; }
        .pc-history-detail-header button { width: 2.2rem; height: 2.2rem; border: 1px solid #cbded1; border-radius: 50%; background: #fff; color: #176c3f; }
        .pc-history-detail-body { padding: .5rem 1rem 1.2rem; }
        .pc-history-detail-row { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .7rem; padding: .6rem 0; border-bottom: 1px solid #e1ece4; }
        .pc-history-detail-row span { color: #6b8172; font-size: .76rem; font-weight: 700; }
        .pc-history-detail-row strong { color: #173326; font-size: .9rem; }
        @media (max-width: 640px) {
            body.student-portal.pc-station-page .main-container > main { gap: .75rem; }
            body.student-portal.pc-station-page #pcScanInfo,
            body.student-portal.pc-station-page #pcScanInfo + section { padding: .85rem !important; border: 0; border-radius: 1rem; box-shadow: none; }
            body.student-portal.pc-station-page #pcScanInfo + section h2 { margin-bottom: .35rem; font-size: 1.05rem; }
            .pc-scan-icon { width: 2.15rem; height: 2.15rem; border: 0; background: transparent; font-size: 1.05rem; }
            .pc-scan-copy p { display: none; }
            .pc-logs-link { padding: .3rem; border: 0; background: transparent; font-size: 0; color: #16834a; }
            .pc-logs-link i { font-size: 1rem; }
            .usage-history-scroll { border: 0; border-radius: 0; }
            .usage-history-table tbody { display: block; }
            .usage-history-table tr[data-history-index] { display: flex; align-items: center; gap: .7rem; padding: .65rem 0; border: 0; border-bottom: 1px solid #e1ece4; background: transparent; cursor: pointer; }
            .usage-history-table tr[data-history-index] td { display: none; }
            .usage-history-table tr[data-history-index] td:first-child { display: block; flex: 1 1 auto; min-width: 0; padding: 0; border: 0; }
            .usage-history-table tr[data-history-index] td:last-child { display: block; flex: 0 0 auto; padding: 0; border: 0; }
            .usage-history-table tr[data-history-index] td:first-child .usage-history-cell-label { display: none; }
            .usage-history-table tr[data-history-index] .usage-history-value { display: grid; gap: .12rem; }
            .usage-history-table tr[data-history-index] .usage-history-primary { overflow: hidden; color: #173326; font-size: .92rem; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
            .usage-history-mobile-date { display: block; color: #71877a; font-size: .75rem; font-weight: 400; }
            .usage-history-mobile-chevron { display: block; color: #16834a; font-size: .8rem; }
            .usage-history-table tr[data-history-index] td:last-child .usage-history-cell-label { display: none; }
            .usage-history-table tr[data-history-index] td:last-child .usage-history-primary { color: #173326; font-size: .82rem; font-weight: 800; white-space: nowrap; }
            .usage-history-table tr[data-history-index] td:last-child .usage-history-value::before { display: none; }
        }
        html:not(.theme-light) .pc-history-detail-sheet { border-color: rgba(110,231,183,.25); background: #0c2118; color: #e1f4e8; }
        html:not(.theme-light) .pc-history-detail-header { border-color: rgba(110,231,183,.16); }
        html:not(.theme-light) .pc-history-detail-header h2,
        html:not(.theme-light) .pc-history-detail-row strong { color: #f0fdf4; }
        html:not(.theme-light) .pc-history-detail-header button { border-color: rgba(110,231,183,.25); background: #173326; color: #a7f3d0; }
        html:not(.theme-light) .pc-history-detail-row { border-color: rgba(110,231,183,.14); }
        html:not(.theme-light) .pc-history-detail-row span { color: #9ab4a4; }

        /* Keep the history list compact on the rendered page; full details are in the sheet. */
        body.student-portal.pc-station-page #historyContainer .usage-history-scroll,
        body.student-portal.pc-station-page #historyContainer .usage-history-table,

<body class="app-shell student-portal system-layout-page pc-station-page">
    <div id="shared-sidebar"></div>

    <div class="main-container">

                <button id="mobileMenuToggle" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">

                </button>
                <div class="student-page-heading-copy">
                    <h1 class="student-page-title student-university-title">MINDORO STATE UNIVERSITY</h1>
                </div>
            </div>
            <div class="pc-station-header-actions" data-theme-toggle-anchor>
                <div class="student-page-user">
                    <span class="student-page-user-initials" data-user-initials>ST</span>
                    <span class="student-page-user-role" data-user-role>Student</span>
                </div>
            </div>
        </header>

        <main class="mx-auto flex w-full max-w-screen-2xl flex-col gap-4 px-3 py-3 md:px-4 md:py-4">
            <section id="pcScanInfo" class="glass-card rounded-[1.5rem] p-4 md:p-5" aria-labelledby="pcScanInfoTitle">
                <div class="pc-session-heading">
                    <div class="pc-scan-copy">
                        <span class="pc-scan-icon" aria-hidden="true"><i class="fas fa-desktop"></i></span>
                        <div>
                            <h2 id="pcScanInfoTitle">My PC Station</h2>
                        </div>
                    </div>
                    <a class="pc-logs-link" href="/student-audit-history">
                        <i class="fas fa-clock-rotate-left" aria-hidden="true"></i>
                        View PC Logs
                    </a>
                </div>
                <div id="activePCSessionContainer" aria-live="polite">
                    <div class="pc-session-empty"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>Checking your active PC station…</div>
                </div>
                <div id="pcSessionFeedback" class="pc-session-feedback" role="status" aria-live="polite"></div>
            </section>

            <!-- Usage History Section -->
            <section id="usageHistorySection" class="glass-card rounded-[1.5rem] p-4 md:p-5">
                <h2 class="text-2xl font-semibold text-white mb-4">
                    <i class="fas fa-history mr-2"></i>Usage History
                </h2>
                <div id="historyContainer">
                    <div class="text-center py-8">
                        <i class="fas fa-spinner fa-spin text-4xl text-green-400"></i>
                        <p class="mt-4 text-gray-400">Loading usage history...</p>
                    </div>
                </div>
            </section>
    </main>
    </div>

    <div id="pcHistoryDetailBackdrop" class="pc-history-detail-backdrop" hidden>
        <section id="pcHistoryDetailSheet" class="pc-history-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="pcHistoryDetailTitle" hidden>
            <div class="pc-history-detail-handle" aria-hidden="true"></div>
            <div class="pc-history-detail-header">
                <h2 id="pcHistoryDetailTitle">Session details</h2>
                <button type="button" id="closePcHistoryDetail" aria-label="Close session details"><i class="fas fa-times" aria-hidden="true"></i></button>
            </div>
            <div id="pcHistoryDetailBody" class="pc-history-detail-body"></div>
        </section>
    </div>

    <script>
        window.__CURRENT_USER__ = __CURRENT_USER_JSON__;

        async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timeout);
            }
        }

        async function loadMyPCStationSessions() {
            const container = document.getElementById('activePCSessionContainer');
            if (!container) return;

            try {
                const response = await fetchWithTimeout('/api/pc-stations/my-sessions', {
                    cache: 'no-store',
                    headers: { Accept: 'application/json' }
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'Unable to load your active PC station.');

                const sessions = Array.isArray(payload.sessions) ? payload.sessions : [];
                if (!sessions.length) {
                    container.innerHTML = `
                        <div class="pc-session-empty">
                            <button type="button" class="pc-session-scan-action" id="pcStationScanButton"><i class="fas fa-qrcode" aria-hidden="true"></i><span>Scan QR to log in</span></button>
                            <span>Scan a station QR code to start a session. Scan the same code again to end it.</span>
                        </div>`;
                    return;
                }

                container.innerHTML = `<div class="pc-session-list">${sessions.map(session => `
                    <article class="pc-session-item">
                        <div class="pc-session-item-copy">
                            <strong>${escapeHistoryText(session.setName || session.setId || 'PC Station')}</strong>
                            <span>${escapeHistoryText([session.setId, session.location].filter(Boolean).join(' · '))}</span>
                            <span>Signed in ${escapeHistoryText(formatHistoryDateTime(session.startedAt))}</span>
                        </div>
                        <button class="pc-session-logout" type="button" data-pc-station-logout="${escapeHistoryText(session.setId)}">
                            <i class="fas fa-right-from-bracket" aria-hidden="true"></i>Log out
                        </button>
                    </article>`).join('')}</div>`;

                container.querySelectorAll('[data-pc-station-logout]').forEach(button => {
                    button.addEventListener('click', () => logoutMyPCStationSession(button));
                });
            } catch (error) {
                console.error('Error loading active PC station:', error);
                container.innerHTML = `
                    <div class="pc-session-empty">
                        <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
                        <span>${escapeHistoryText(error.message || 'Unable to load your active PC station.')}</span>
                    </div>`;
            }
        }

        async function logoutMyPCStationSession(button) {
            const confirmed = window.appDialogs?.confirm
                ? await window.appDialogs.confirm('Log out from this PC station?')
                : window.confirm('Log out from this PC station?');
            if (!confirmed) return;

            const setId = button.dataset.pcStationLogout;
            const feedback = document.getElementById('pcSessionFeedback');
            feedback.textContent = '';
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>Logging out…';

            try {
                const response = await fetchWithTimeout('/api/pc-stations/my-sessions/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify({ setId })
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'Unable to log out from this PC station.');

                feedback.textContent = payload.message || 'You have been signed out from this PC station.';
                await Promise.allSettled([loadMyPCStationSessions(), loadUsageHistory()]);
            } catch (error) {
                feedback.textContent = error.message || 'Unable to log out from this PC station.';
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-right-from-bracket" aria-hidden="true"></i>Log out';
            }
        }

        let usageHistoryRecords = [];

        // Usage History Functions
        function escapeHistoryText(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function toggleHistoryLab(button) {
            const expanded = button.classList.toggle('is-expanded');
            button.closest('tr')?.classList.toggle('has-expanded-lab', expanded);
            button.setAttribute('aria-expanded', String(expanded));
            button.title = expanded ? 'Tap to collapse laboratory name' : 'Tap to show full laboratory name';
        }

        function formatHistoryCourseSection(value) {
            return String(value ?? '')
                .replace(/\s*\?{2,}\s*/g, ' · ')
                .replace(/(?:\s*·\s*){2,}/g, ' · ')
                .replace(/\s+/g, ' ')
                .replace(/^\s*·\s*|\s*·\s*$/g, '')
                .trim();
        }

        function formatHistoryDateTime(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '—';
            const options = {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            };
            if (date.getFullYear() !== new Date().getFullYear()) options.year = 'numeric';
            return date.toLocaleString(undefined, options);
        }

        function formatHistoryTime(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '—';
            return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        function formatHistoryCompactDate(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '—';
            return date.toLocaleString(undefined, {
                month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
            }).replace(', ', ' · ');
        }

        function formatHistoryDuration(minutes) {
            if (minutes == null) return null;
            const totalMinutes = Number(minutes);
            if (!Number.isFinite(totalMinutes) || totalMinutes < 0) return null;
            const hours = Math.floor(totalMinutes / 60);
            const remainingMinutes = Math.round(totalMinutes % 60);
            if (!hours) return `${remainingMinutes} min`;
            return remainingMinutes ? `${hours} hr ${remainingMinutes} min` : `${hours} hr`;
        }

        async function loadUsageHistory() {
            const container = document.getElementById('historyContainer');
            
            try {
                const user = window.__CURRENT_USER__ || {};
                
                if (!user.id) throw new Error('User not logged in');
                const response = await fetchWithTimeout(`/api/equipment/usage-history/${user.id}`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to load usage history');
                const history = data.usageHistory || [];

                if (history.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-history text-4xl mb-4 opacity-50"></i>
                            <p>No usage history yet</p>
                        </div>
                    `;
                } else {
                    usageHistoryRecords = history;
                    container.innerHTML = `
                        <div class="usage-history-scroll overflow-x-auto" tabindex="0" aria-label="Scrollable PC usage history">
                            <table class="usage-history-table">
                                <thead><tr><th>Station</th><th>Class / Subject</th><th>Instructor</th><th>Laboratory</th><th>Started</th><th>Ended</th><th>Duration</th></tr></thead>
                                <tbody>${history.map((item, index) => `
                                    <tr data-history-index="${index}" tabindex="0" role="button" aria-label="View session details">
                                        <td><span class="usage-history-cell-label">Station</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(item.stationName || (item.pcSetId ? `PC Station ${item.pcSetId.replace(/^PC-SET-/i, '')}` : 'PC Station'))}</span><small class="usage-history-mobile-date">${escapeHistoryText(formatHistoryCompactDate(item.usageStartTime))}</small></span><i class="fas fa-chevron-right usage-history-mobile-chevron" aria-hidden="true"></i></td>
                                        <td><span class="usage-history-cell-label">Class / Subject</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(formatHistoryCourseSection(item.courseSection) || (item.attendanceId ? 'Class session' : 'Unscheduled session'))}</span><small>${escapeHistoryText(item.subject || (item.attendanceId ? item.traceStatus || 'Class details unavailable' : 'No class schedule — session recorded'))}</small></span></td>
                                        <td><span class="usage-history-cell-label">Instructor</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(item.instructor || '—')}</span></span></td>
                                        <td><span class="usage-history-cell-label">Laboratory</span><button class="usage-history-value usage-history-expandable" type="button" aria-expanded="false" title="Tap to show full laboratory and room" onclick="toggleHistoryLab(this)"><span class="usage-history-primary">${escapeHistoryText(item.laboratoryRoom || '—')}</span></button></td>
                                        <td><span class="usage-history-cell-label">Started</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(formatHistoryDateTime(item.usageStartTime))}</span></span></td>
                                        <td><span class="usage-history-cell-label">Ended</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(item.usageEndTime ? formatHistoryDateTime(item.usageEndTime) : 'Active')}</span></span></td>
                                        <td><span class="usage-history-cell-label">Duration</span><span class="usage-history-value"><span class="usage-history-primary">${escapeHistoryText(formatHistoryDuration(item.durationMinutes) ?? (item.usageEndTime ? 'Unavailable' : 'Active'))}</span></span></td>
                                    </tr>
                                `).join('')}</tbody>
                            </table>
                        </div>`;
                }
            } catch (error) {
                console.error('Error loading usage history:', error);
                container.innerHTML = `
                    <div class="pc-error">
                        <p>Unable to load usage history</p>
                    </div>
                `;
            }
        }

        function openPcHistoryDetail(index) {
            const item = usageHistoryRecords[index];
            const backdrop = document.getElementById('pcHistoryDetailBackdrop');
            const sheet = document.getElementById('pcHistoryDetailSheet');
            const body = document.getElementById('pcHistoryDetailBody');
            if (!item || !backdrop || !sheet || !body) return;
            const station = item.stationName || (item.pcSetId ? `PC Station ${String(item.pcSetId).replace(/^PC-SET-/i, '')}` : 'PC Station');
            const details = [
                ['Duration', formatHistoryDuration(item.durationMinutes) || (item.usageEndTime ? 'Unavailable' : 'Active')],
                ['Class / Subject', formatHistoryCourseSection(item.courseSection) || (item.attendanceId ? 'Class session' : 'Unscheduled session')],
                ['Instructor', item.instructor || '—'],
                ['Laboratory', item.laboratoryRoom || '—'],
                ['Started', formatHistoryDateTime(item.usageStartTime)],
                ['Ended', item.usageEndTime ? formatHistoryDateTime(item.usageEndTime) : 'Active']
            ];
            document.getElementById('pcHistoryDetailTitle').textContent = station;
            body.innerHTML = details.map(([label, value]) => `<div class="pc-history-detail-row"><span>${escapeHistoryText(label)}</span><strong>${escapeHistoryText(value)}</strong></div>`).join('');
            backdrop.hidden = false;
            sheet.hidden = false;
            requestAnimationFrame(() => backdrop.classList.add('is-open'));
        }

        function closePcHistoryDetail() {
            const backdrop = document.getElementById('pcHistoryDetailBackdrop');
            const sheet = document.getElementById('pcHistoryDetailSheet');
            if (!backdrop || !sheet) return;
            backdrop.classList.remove('is-open');
            window.setTimeout(() => { backdrop.hidden = true; sheet.hidden = true; }, 180);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            const loadingFallback = window.setTimeout(() => {
                const history = document.getElementById('historyContainer');
                if (history?.querySelector('.fa-spinner')) {
                    history.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-history text-4xl mb-4 opacity-50"></i>
                            <p>Usage history is unavailable right now.</p>
                        </div>
                    `;
                }
            }, 9000);
            await Promise.allSettled([loadMyPCStationSessions(), loadUsageHistory()]);
            window.clearTimeout(loadingFallback);

            const historyContainer = document.getElementById('historyContainer');
            document.getElementById('pcStationScanButton')?.addEventListener('click', () => {
                document.getElementById('qr-scan-float-btn')?.click();
            });
            historyContainer?.addEventListener('click', (event) => {
                const row = event.target.closest('[data-history-index]');
                if (row) openPcHistoryDetail(Number(row.dataset.historyIndex));
            });
            historyContainer?.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') return;
                const row = event.target.closest('[data-history-index]');
                if (!row) return;
                event.preventDefault();
                openPcHistoryDetail(Number(row.dataset.historyIndex));
            });
            document.getElementById('closePcHistoryDetail')?.addEventListener('click', closePcHistoryDetail);
            document.getElementById('pcHistoryDetailBackdrop')?.addEventListener('click', (event) => {
                if (event.target.id === 'pcHistoryDetailBackdrop') closePcHistoryDetail();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closePcHistoryDetail();
            });

            const refreshPCStationData = () => {
                if (document.visibilityState === 'visible') {
                    Promise.allSettled([loadMyPCStationSessions(), loadUsageHistory()]);
                }
            };
            window.setInterval(refreshPCStationData, 15000);
            window.addEventListener('focus', refreshPCStationData);
            document.addEventListener('visibilitychange', refreshPCStationData);
        });
    </script>
    <script src="/js/student-sidebar-config.js?v=31" defer></script>
    <script src="/js/sidebar-component.js?v=79" defer></script>
