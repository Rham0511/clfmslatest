<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Equipment Issue | ComLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/sidebar.css?v=75">
    <style>
        :root { --bg: #020617; --bg-secondary: #07111f; }
        body {
            background: radial-gradient(circle at top left, rgba(34,197,94,.12), transparent 28%), linear-gradient(180deg, #020617 0%, #07111f 100%);
            color: #f8fafc; min-height: 100vh;
        }
        .main-container {
            min-height: 100vh;
            margin-left: calc(var(--sidebar-width, 280px) + 0.75rem);
            width: calc(100% - var(--sidebar-width, 280px) - 0.75rem);
        }
        body.student-portal.student-report-equipment-page .student-page-heading-copy {
            margin-left: 0.75rem;
        }
        body.student-portal.student-report-equipment-page .student-page-subtitle {
            display: block;
            max-width: 100%;
            margin: 0;
            overflow: visible;
            color: #a7f3d0 !important;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1.25;
            text-overflow: clip;
            white-space: normal;
        }
        body.student-report-equipment-page .report-choice-heading,
        body.student-report-equipment-page .report-scope-heading,
        body.student-report-equipment-page .issue-type-label,
        body.student-report-equipment-page .issue-description-label,
        body.student-report-equipment-page .component-label,
        body.student-report-equipment-page .pc-station-label,
        body.student-report-equipment-page #equipmentIdPanel > label {
            font-size: 0.9375rem !important; /* 15px */
            font-weight: 600;
            line-height: 1.4;
        }
        body.student-report-equipment-page #pcEntireSummary > p,
        body.student-report-equipment-page #pcEntireList {
            font-size: 0.8125rem !important; /* 13px */
        }
        body.student-report-equipment-page #issueCategory,
        body.student-report-equipment-page .form-input,
        body.student-report-equipment-page .form-select {
            font-size: 0.875rem !important; /* 14px */
        }
        .report-issue-header-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 0.55rem;
            margin-left: auto;
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(8,24,16,.85), rgba(6,18,13,.95));
            border: 1px solid rgba(74,222,128,.18);
            border-radius: 1.25rem;
            box-shadow: 0 12px 32px rgba(2,10,8,.25);
        }
        .report-tabs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0;
            margin-bottom: 1rem;
            overflow: hidden;
            border: 2px solid #648472;
            border-radius: 1.55rem;
            background: #edf7f0;
        }
        .report-tab {
            min-height: 3.7rem;
            border: 0;
            background: transparent;
            color: #111827;
            font: inherit;
            font-size: clamp(1rem, 4.8vw, 1.35rem);
            font-weight: 800;
            cursor: pointer;
        }
        .report-tab + .report-tab { border-left: 1px solid #c8d9ce; }
        .report-tab.is-active {
            background: #ffffff;
            color: #14251c;
            box-shadow: inset 0 -4px #18884d;
        }
        .report-tab:focus-visible { outline: 3px solid #4ade80; outline-offset: -3px; }
        .report-method-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; overflow: hidden; border: 1px solid #c8d9ce; border-radius: .85rem; background: #f7fbf8; }
        .report-method-options .radio-card { display: flex; min-height: 3.2rem; align-items: center; justify-content: center; padding: .7rem .55rem; border: 0; border-radius: 0; background: transparent; color: #536c5c; text-align: center; }
        .report-method-options .radio-card + .radio-card { border-left: 1px solid #c8d9ce; }
        .report-method-options .radio-card.selected { background: #ffffff; box-shadow: inset 0 -3px #18884d; color: #173326; }
        .report-method-options .radio-card input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .report-method-options .radio-card p { margin: 0; font-size: .86rem; font-weight: 800; }
        .report-method-options .radio-card p:last-child { display: none; }
        .my-reports-tab-panel iframe {
            display: block;
            width: 100%;
            min-height: 42rem;
            border: 0;
        }
        .my-reports-tab-panel[hidden] { display: none !important; }
        .my-reports-panel {
            padding: clamp(1.15rem, 4vw, 1.7rem);
            border-color: #d5e5da;
            background: #ffffff;
            box-shadow: none;
        }
        .my-reports-heading {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: 1rem;
        }
        .my-reports-heading-icon {
            display: grid;
            width: 2.5rem;
            height: 2.5rem;
            place-items: center;
            border: 1px solid rgba(34,197,94,.2);
            border-radius: .8rem;
            background: rgba(34,197,94,.12);
            color: #16834a;
        }
        .my-reports-heading h2 { margin: 0; color: #173326; font-size: clamp(1.35rem, 6vw, 1.8rem); font-weight: 800; }
        .my-reports-controls { display: grid; grid-template-columns: minmax(0, 1fr) 9rem; gap: .65rem; margin-bottom: .8rem; }
        .my-reports-control { display: flex; min-height: 3rem; align-items: center; gap: .55rem; padding: 0 .85rem; border: 1px solid #cde2d4; border-radius: .9rem; background: #f8fbf9; color: #16834a; }
        .my-reports-control input, .my-reports-control select { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: #173326; font: inherit; }
        .my-reports-list { display: grid; gap: .55rem; }
        .my-report-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; gap: .7rem; min-height: 4.8rem; padding: .85rem 1rem; border: 2px solid #d5e5da; border-radius: 1.35rem; background: #ffffff; }
        .my-report-row strong { display: block; color: #173326; font-size: clamp(.92rem, 3.8vw, 1.05rem); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
        .my-report-equipment-id { color: #71877a; font-weight: 500; }
        .my-report-row small { display: block; margin-top: .2rem; overflow: hidden; color: #71877a; font-size: .9rem; text-overflow: ellipsis; white-space: nowrap; }
        .my-report-actions { display: flex; min-width: 5.9rem; flex-direction: column; align-items: flex-end; justify-content: space-between; }
        .my-report-status { display: inline-flex; align-items: center; gap: .35rem; color: #8a6200; font-size: clamp(.75rem, 3.5vw, .95rem); font-weight: 800; white-space: nowrap; }
        .my-report-status::before { content: ''; width: .75rem; height: .75rem; flex: 0 0 .75rem; border-radius: 50%; background: #f5bd17; }
        .my-report-status.cancelled { color: #536c5c; }
        .my-report-status.cancelled::before { background: #cbd0d3; }
        .my-report-status.resolved { color: #16834a; }
        .my-report-status.resolved::before { background: #1ca45a; }
        .my-report-arrow { color: #16834a; font-size: 1.65rem; font-weight: 800; line-height: .8; }
        .my-report-row { cursor: pointer; transition: border-color .16s, box-shadow .16s; }
        .my-report-row:hover, .my-report-row:focus-visible { border-color: #8bc9a5; box-shadow: 0 4px 14px rgba(22,131,74,.1); outline: none; }
        .my-report-row.is-expanded { border-color: #8bc9a5; }
        .my-report-row.is-expanded .my-report-arrow { transform: rotate(90deg); }
        .my-report-details { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; padding-top: .75rem; border-top: 1px solid #dce8df; }
        .my-report-detail { min-width: 0; padding: .55rem .65rem; border-radius: .7rem; background: #f5faf6; }
        .my-report-detail.full { grid-column: 1 / -1; }
        .my-report-detail-label { display: block; margin-bottom: .2rem; color: #71877a; font-size: .65rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
        .my-report-detail-value { color: #173326; font-size: .82rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
        .my-reports-empty { padding: 2rem 1rem; color: #71877a; text-align: center; }
        @media (max-width: 520px) { .my-reports-controls { grid-template-columns: minmax(0, 1fr) 7rem; } .my-report-row { gap: .45rem; padding: .75rem; } .my-report-status { font-size: .7rem; } .my-report-details { grid-template-columns: minmax(0, 1fr); } .my-report-detail.full { grid-column: auto; } }
        html.theme-light .report-tabs { border-color: #648472; background: #edf7f0; }
        html.theme-light .report-tab { color: #111827; }
        .radio-card {
            border: 1.5px solid rgba(74,222,128,.16);
            background: rgba(6, 17, 24, 0.45);
            border-radius: 0.85rem;
            padding: 0.75rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .report-method-options,
        .report-scope-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: stretch;
            gap: 0.6rem;
        }
        .report-method-options .radio-card,
        .report-scope-options .radio-card {
            min-width: 0;
            align-items: flex-start;
            padding: 0.75rem 0.9rem;
        }
        .report-method-options .radio-card > div,
        .report-scope-options .radio-card > div {
            min-width: 0;
        }
        .report-method-options .radio-card p:last-child,
        .report-scope-options .radio-card p:last-child {
            overflow-wrap: anywhere;
        }
        .radio-card:hover { border-color: rgba(74,222,128,.35); background: rgba(7, 26, 18, 0.55); }
        .radio-card.selected { border-color: #22c55e; background: rgba(34,197,94,.09); box-shadow: 0 0 0 1px rgba(34,197,94,0.3); }
        .form-input, .form-select {
            width: 100%; border-radius: 0.75rem;
            border: 1px solid rgba(74,222,128,.18); background: rgba(4, 13, 9, 0.85);
            color: #f8fafc; padding: 0.65rem 0.85rem; outline: none;
            font-size: 0.875rem; transition: all 0.2s ease;
        }
        .form-input:focus, .form-select:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.15);
        }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: linear-gradient(135deg, #16a34a, #22c55e); color: white;
            border-radius: 0.75rem; padding: 0.7rem 1.3rem; font-weight: 600;
            font-size: 0.875rem;
            box-shadow: 0 4px 14px rgba(34,197,94,.22);
            transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.35);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background: rgba(12, 36, 24, 0.65) !important;
            color: rgba(120, 175, 140, 0.45) !important;
            border: 1px solid rgba(74, 222, 128, 0.12) !important;
            opacity: 0.6; cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }
        .equipment-suggestion-list {
            position: absolute;
            z-index: 20;
            top: calc(100% + 0.35rem);
            left: 0;
            right: 0;
            max-height: 15rem;
            overflow-y: auto;
            padding: 0.3rem;
            border: 1px solid rgba(74,222,128,.25);
            border-radius: 0.875rem;
            background: #020617;
            box-shadow: 0 14px 30px rgba(0,0,0,.35);
        }
        .equipment-suggestion {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.65rem 0.75rem;
            border: 0;
            border-radius: 0.6rem;
            background: transparent;
            color: #f8fafc;
            text-align: left;
            cursor: pointer;
        }
        .equipment-suggestion:hover,
        .equipment-suggestion:focus-visible {
            outline: none;
            background: rgba(34,197,94,.14);
        }
        .equipment-suggestion-id {
            color: #6ee7b7;
            font-family: monospace;
            white-space: nowrap;
        }
        .equipment-suggestion-name {
            overflow: hidden;
            color: #cbd5e1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @media (max-width: 1023px) {
            .main-container {
                margin-left: 0;
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .report-method-options,
            .report-scope-options {
                grid-template-columns: minmax(0, 1fr);
            }

            .main-container > header {
                position: static !important;
                padding: 0 !important;
            }

            .main-container > header > div {
                padding: 0 !important;
            }

            .student-page-header {
                min-height: 4.25rem;
                align-items: center;
                flex-wrap: nowrap;
                gap: 0.45rem;
                margin: 0;
                padding: 0.4rem 0.5rem;
                border-radius: 1rem;
            }

            .student-page-header .student-page-heading {
                width: auto;
                min-width: 0;
                flex: 1 1 auto;
                gap: 0.5rem;
            }

            .student-page-header .student-page-menu {
                width: 2.45rem;
                height: 2.45rem;
                flex-basis: 2.45rem;
            }

            .student-page-header .student-page-title {
                font-size: clamp(0.78rem, 3.6vw, 0.96rem);
                line-height: 1.15;
            }

            .student-page-header .student-page-subtitle {
                font-size: 0.48rem;
                letter-spacing: 0.09em;
            }

            .student-page-header .student-page-user {
                min-height: 1.9rem;
                gap: 0.25rem;
                margin: 0;
                padding: 0.16rem 0.38rem 0.16rem 0.2rem;
            }

            .student-page-header .student-page-user-initials {
                width: 1.4rem;
                height: 1.4rem;
            }

            .student-page-header .student-page-user-role {
                font-size: 0.47rem;
                letter-spacing: 0.08em;
            }

            .main-container > main {
                padding: 0.85rem 0.75rem 1.5rem;
            }

            .glass-card {
                padding: 1.1rem;
                border-radius: 1.2rem;
            }

            .radio-card {
                min-height: 4.25rem;
                padding: 0.9rem;
                border-width: 1px;
                border-radius: 1rem;
                align-items: flex-start;
            }

            .radio-card input[type="radio"] {
                width: 1.1rem;
                height: 1.1rem;
                flex: 0 0 auto;
                margin-top: 0.15rem !important;
            }

            .form-input,
            .form-select {
                min-height: 3rem;
                font-size: 1rem;
            }

            #equipmentIdPanel > div:first-of-type {
                align-items: stretch;
            }

            #equipmentIdPanel .btn-primary {
                min-width: 3rem;
                justify-content: center;
            }

            #submitBtn {
                min-height: 3.1rem;
                border-radius: 0.9rem;
            }
        }
    </style>

<body class="app-shell student-portal system-layout-page student-report-equipment-page">
    <div id="shared-sidebar"></div>

    <div class="main-container">
        <header class="sticky top-0 z-30 pt-2">
            <div class="px-3">
                <div class="student-page-header">
                    <div class="student-page-heading">
                        <button id="mobileMenuToggle" type="button" aria-label="Open navigation" aria-expanded="false" onclick="toggleSidebar()">
                            <i class="fas fa-bars" aria-hidden="true"></i>
                        </button>
                        <div class="student-page-heading-copy">
                            <h1 class="student-page-title student-university-title">MINDORO STATE UNIVERSITY</h1>
                        </div>
                    </div>
                    <div class="report-issue-header-actions" data-theme-toggle-anchor>
                        <div class="student-page-user">
                            <span class="student-page-user-initials" data-user-initials>ST</span>
                            <span class="student-page-user-role" data-user-role>Student</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="px-3 pt-4 pb-8">
            <nav class="report-tabs" aria-label="Report issue navigation">
                <button type="button" class="report-tab is-active" data-report-tab="issue" aria-selected="true">Report Issue</button>
                <button type="button" class="report-tab" data-report-tab="reports" aria-selected="false">My Reports</button>
            </nav>

            <div id="reportIssuePanel">
            <section class="glass-card p-6">
                <!-- STEP 1: Choose Report Method -->
                <div id="step1" class="mb-5">
                    <p class="report-choice-heading mb-3 font-semibold text-white">How do you want to report?</p>
                    <div class="report-method-options">
                        <label class="radio-card flex items-start gap-3" id="methodCard1">
                            <input type="radio" name="reportMethod" value="by-equipment" onchange="onMethodChange()" style="margin-top:2px;accent-color:#22c55e;">
                            <div>
                                <p class="text-sm font-semibold text-white">Equipment ID</p>
                                <p class="text-xs text-slate-400 mt-0.5">Enter equipment ID directly</p>
                            </div>
                        </label>
                        <label class="radio-card flex items-start gap-3" id="methodCard2">
                            <input type="radio" name="reportMethod" value="by-pc-station" onchange="onMethodChange()" style="margin-top:2px;accent-color:#22c55e;">
                            <div>
                                <p class="text-sm font-semibold text-white">PC Station</p>
                                <p class="text-xs text-slate-400 mt-0.5">Select a PC station, then pick what to report</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- STEP 2a: Equipment ID Entry -->
                <div id="equipmentIdPanel" style="display:none;" class="mb-5">
                    <label class="text-sm font-semibold text-emerald-400 block mb-2">Equipment ID</label>
                    <div class="flex gap-2">
                        <div class="relative min-w-0 flex-1">
                            <input id="equipmentInput" class="form-input" placeholder="e.g. KBD-PC-001" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="equipmentSuggestions" />
                            <div id="equipmentSuggestions" class="equipment-suggestion-list" role="listbox" style="display:none;"></div>
                        </div>
                        <button onclick="searchEquipment()" class="btn-primary" style="border-radius:0.875rem;padding:0.875rem 1.2rem;">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                    <div id="searchStatus" class="mt-2 text-xs" style="display:none;"></div>
                    <div id="equipmentInfo" style="display:none;" class="mt-3 p-4 rounded-xl border border-emerald-500/10 bg-emerald-950/20">
                        <p class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Equipment Found</p>
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div><span class="text-slate-500 text-xs">Name:</span> <span id="eqName" class="text-white font-semibold">—</span></div>
                            <div><span class="text-slate-500 text-xs">ID:</span> <span id="eqId" class="text-emerald-400 font-mono font-semibold">—</span></div>
                        </div>
                    </div>
                </div>

                <!-- STEP 2b: PC Station Picker -->
                <div id="pcStationPanel" style="display:none;" class="mb-5">
                    <label class="pc-station-label text-sm font-semibold text-emerald-400 block mb-2">Select PC Station</label>
                    <select id="pcStationSelect" class="form-select" onchange="onPCStationSelect()">
                        <option value="">— Choose PC Station —</option>
                    </select>
                    <div id="pcStationStatus" class="mt-2 text-xs" style="display:none;"></div>
                </div>

                <!-- PC Set Scope (after selecting PC Station) -->
                <div id="pcSetScopePanel" style="display:none;" class="mb-5">
                    <p class="report-scope-heading text-sm font-semibold text-white mb-3">What do you want to report?</p>
                    <div class="report-scope-options">
                        <label class="radio-card flex items-start gap-3" id="scopeCard1">
                            <input type="radio" name="pcSetScope" value="component" onchange="onPCSetScopeChange()" style="margin-top:2px;accent-color:#22c55e;">
                            <div>
                                <p class="text-sm font-semibold text-white">One specific component</p>
                                <p class="text-xs text-slate-400 mt-0.5">Select a single item</p>
                            </div>
                        </label>
                        <label class="radio-card flex items-start gap-3" id="scopeCard2">
                            <input type="radio" name="pcSetScope" value="entire" onchange="onPCSetScopeChange()" style="margin-top:2px;accent-color:#22c55e;">
                            <div>
                                <p class="text-sm font-semibold text-white">Entire PC Station</p>
                                <p class="text-xs text-slate-400 mt-0.5">Report all components</p>
                            </div>
                        </label>
                    </div>

                    <!-- Component picker -->
                    <div id="pcComponentPicker" style="display:none;" class="mt-3">
                        <label class="component-label text-sm font-semibold text-emerald-400 block mb-2">Select Component</label>
                        <select id="pcComponentSelect" class="form-select" onchange="onPCComponentSelect()">
                            <option value="">— Choose component —</option>
                        </select>
                    </div>

                    <!-- Entire station summary -->
                    <div id="pcEntireSummary" style="display:none;" class="mt-3 p-4 rounded-xl border border-amber-500/20 bg-amber-500/5">
                        <p class="text-xs font-bold text-amber-400 mb-2"><i class="fas fa-exclamation-triangle mr-1"></i>All components will be reported</p>
                        <div id="pcEntireList" class="text-xs text-slate-300 space-y-1"></div>
                    </div>
                </div>

                <!-- Issue Description -->
                <div class="mb-5">
                    <label for="issueCategory" class="issue-type-label text-sm font-semibold text-emerald-400 block mb-2">Issue Type</label>
                    <select id="issueCategory" class="form-select">
                        <option value="Equipment Damage">Equipment Damage</option>
                        <option value="Equipment Missing">Equipment Missing</option>
                        <option value="Connectivity">Connectivity / Performance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-5">
                    <label for="issueDescription" class="issue-description-label text-sm font-semibold text-emerald-400 block mb-2">Describe the Issue <span class="text-red-400">*</span></label>
                    <textarea id="issueDescription" rows="4" maxlength="3000" class="form-input resize-none" placeholder="Describe what's wrong with the equipment..." required></textarea>
                </div>

                <div id="submitStatus" role="status" aria-live="polite" style="display:none;" class="mb-4 p-3 rounded-xl text-sm"></div>

                <button id="submitBtn" onclick="submitReport()" class="btn-primary w-full justify-center" disabled>
                    <i class="fas fa-paper-plane"></i> Submit Report
                </button>
            </section>
            </div>

            <section id="myReportsPanel" class="my-reports-tab-panel" hidden aria-label="My Reports">
                <div class="glass-card my-reports-panel">
                    <div class="my-reports-controls">
                        <label class="my-reports-control"><i class="fas fa-search" aria-hidden="true"></i><input id="myReportsSearch" type="search" placeholder="Search reports" aria-label="Search reports"></label>
                        <label class="my-reports-control"><i class="fas fa-filter" aria-hidden="true"></i><select id="myReportsStatus" aria-label="Filter reports"><option value="all">All</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Resolved">Resolved</option><option value="Rejected">Rejected</option><option value="Cancelled">Cancelled</option></select></label>
                    </div>
                    <div id="myReportsList" class="my-reports-list" aria-live="polite"><div class="my-reports-empty">Loading reports…</div></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        window.__CURRENT_USER__ = __CURRENT_USER_JSON__;

        const reportTabs = document.querySelectorAll('[data-report-tab]');
        const reportIssuePanel = document.getElementById('reportIssuePanel');
        const myReportsPanel = document.getElementById('myReportsPanel');
        reportTabs.forEach((tab) => tab.addEventListener('click', () => {
            const showReports = tab.dataset.reportTab === 'reports';
            reportTabs.forEach((item) => {
                const active = item === tab;
                item.classList.toggle('is-active', active);
                item.setAttribute('aria-selected', String(active));
            });
            reportIssuePanel.hidden = showReports;
            myReportsPanel.hidden = !showReports;
            if (showReports) loadMyReports();
        }));

        const myReportsList = document.getElementById('myReportsList');
        const myReportsSearch = document.getElementById('myReportsSearch');
        const myReportsStatus = document.getElementById('myReportsStatus');
        let myReports = [];
        let myReportsLoaded = false;
        const escapeReportText = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
        const formatReportDate = (value) => {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value || '—') : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        };
        const renderMyReports = () => {
            const query = myReportsSearch.value.trim().toLowerCase();
            const status = myReportsStatus.value;
            const rows = myReports.filter((report) => {
                const reportStatus = String(report.status || 'Pending');
                const text = `${report.equipmentName || ''} ${report.equipmentId || report.equipment_id || ''} ${report.description || ''} ${report.issueTitle || ''}`.toLowerCase();
                return (status === 'all' || reportStatus.toLowerCase() === status.toLowerCase()) && (!query || text.includes(query));
            });
            if (!rows.length) {
                myReportsList.innerHTML = '<div class="my-reports-empty">No reports found.</div>';
                return;
            }
            myReportsList.innerHTML = rows.map((report) => {
                const reportStatus = String(report.status || 'Pending');
                const statusClass = ['resolved', 'approved'].includes(reportStatus.toLowerCase()) ? ' resolved' : '';
                const name = report.equipmentName || report.equipment_id || report.equipmentId || 'Equipment report';
                const equipmentId = report.equipmentId || report.equipment_id || '';
                const issue = report.description || report.issueTitle || 'Equipment issue';
                const date = formatReportDate(report.dateReported || report.date || report.created_at || report.createdAt);
                const statusName = reportStatus.toLowerCase().replace(/\s+/g, '-');
                const detail = (label, value, full = false) => value ? `<div class="my-report-detail${full ? ' full' : ''}"><span class="my-report-detail-label">${label}</span><span class="my-report-detail-value">${escapeReportText(value)}</span></div>` : '';
                const details = [
                    detail('Equipment', `${name}${equipmentId ? ` · ${equipmentId}` : ''}`),
                    detail('Status', reportStatus),
                    detail('Issue type', report.category || report.issueTitle),
                    detail('Submitted', date),
                    detail('Location', [report.laboratoryName, report.laboratoryRoom, report.campus].filter(Boolean).join(' · ')),
                    detail('Assigned to', report.assignedTo || report.assigneeName),
                    detail('Description', report.description || report.summary, true),
                    detail('Remarks', report.remarks || report.adminRemarks, true)
                ].join('');
                return `<article class="my-report-row" data-report-id="${escapeReportText(report.id || report.reportId || equipmentId)}" tabindex="0" aria-expanded="false"><div><strong>${escapeReportText(name)}</strong><small>${equipmentId ? `<span class="my-report-equipment-id">${escapeReportText(equipmentId)} · </span>` : ''}${escapeReportText(issue)} · ${escapeReportText(date)}</small></div><div class="my-report-actions"><span class="my-report-status ${statusName}${statusClass}">${escapeReportText(reportStatus)}</span><span class="my-report-arrow" aria-hidden="true">›</span></div><div class="my-report-details" hidden>${details}</div></article>`;
            }).join('');
        };
        async function loadMyReports() {
            if (myReportsLoaded) return;
            myReportsLoaded = true;
            try {
                const response = await fetch('/api/maintenance?mine=true', { cache: 'no-store' });
                const payload = await response.json();
                if (!response.ok) throw new Error('Unable to load reports');
                myReports = Array.isArray(payload) ? payload : [];
                renderMyReports();
            } catch (error) {
                myReportsList.innerHTML = '<div class="my-reports-empty">Unable to load your reports right now.</div>';
            }
        }
        myReportsSearch.addEventListener('input', renderMyReports);
        myReportsStatus.addEventListener('change', renderMyReports);
        myReportsList.addEventListener('click', (event) => {
            const row = event.target.closest('.my-report-row');
            if (!row) return;
            const details = row.querySelector('.my-report-details');
            const expanded = row.getAttribute('aria-expanded') === 'true';
            row.setAttribute('aria-expanded', String(!expanded));
            row.classList.toggle('is-expanded', !expanded);
            if (details) details.hidden = expanded;
        });
        myReportsList.addEventListener('keydown', (event) => {
            if ((event.key === 'Enter' || event.key === ' ') && event.target.closest('.my-report-row')) {
                event.preventDefault();
                event.target.closest('.my-report-row').click();
            }
        });

        // Keep the old standalone My Reports item out of this combined page,
        // including when an older cached sidebar bundle is still present.
        const removeStandaloneReportsNav = () => {
            document.querySelectorAll('#shared-sidebar .nav-item').forEach((item) => {
                const label = item.querySelector('.sidebar-nav-label')?.textContent.trim().toLowerCase();
                const path = item.getAttribute('href')?.split(/[?#]/, 1)[0];
                if (label === 'my reports' || path === '/student/my-requests' || path === '/student-my-requests') item.remove();
            });
        };
        new MutationObserver(removeStandaloneReportsNav).observe(document.getElementById('shared-sidebar'), { childList: true, subtree: true });
        removeStandaloneReportsNav();

        const user = window.__CURRENT_USER__ || {};
        const name = user.name || '';
        const userRole = String(user.role || 'student').trim().toLowerCase();
        const isFaculty = userRole === 'faculty' || userRole === 'instructor';
        const initials = name.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('') || 'ST';
        document.querySelectorAll('[data-user-initials]').forEach(el => el.textContent = user.initials || initials);
        document.querySelectorAll('[data-user-role]').forEach(el => el.textContent = isFaculty ? 'Faculty' : (user.role||'student').charAt(0).toUpperCase() + (user.role||'student').slice(1));
        if (isFaculty) {
            document.getElementById('reportHeading').textContent = 'Report a Lab Equipment Issue';
            document.getElementById('reportIntro').textContent = 'Select the affected equipment and share clear details so your campus technician can follow up.';
            document.querySelector('#methodCard1 p:last-child').textContent = 'Search equipment assigned to your campus';
        }

        let currentEquipmentId = null;
        let pcSetComponents = [];
        let pcStations = new Map();
        let equipmentCatalogRequest = null;
        let equipmentSuggestionIndex = -1;
        let equipmentValidationRequest = 0;

        function onMethodChange() {
            const selected = document.querySelector('input[name="reportMethod"]:checked');
            if (!selected) return;

            document.getElementById('methodCard1').classList.toggle('selected', selected.value === 'by-equipment');
            document.getElementById('methodCard2').classList.toggle('selected', selected.value === 'by-pc-station');

            if (selected.value === 'by-equipment') {
                document.getElementById('equipmentIdPanel').style.display = '';
                document.getElementById('pcStationPanel').style.display = 'none';
                document.getElementById('pcSetScopePanel').style.display = 'none';
            } else {
                document.getElementById('equipmentIdPanel').style.display = 'none';
                document.getElementById('pcStationPanel').style.display = '';
                document.getElementById('pcSetScopePanel').style.display = 'none';
                loadPCStations();
            }
            document.getElementById('submitBtn').disabled = true;
        }

        document.querySelector('input[name="reportMethod"][value="by-equipment"]').checked = true;
        onMethodChange();

        async function loadPCStations() {
            const select = document.getElementById('pcStationSelect');
            select.replaceChildren(new Option('Loading PC Stations...', ''));
            try {
                const equipment = await getEquipmentCatalog();
                pcStations = new Map();
                equipment.forEach(item => {
                    if (!item.setId) return;
                    if (!pcStations.has(item.setId)) pcStations.set(item.setId, []);
                    pcStations.get(item.setId).push(item);
                });
                select.replaceChildren(new Option('— Choose PC Station —', ''));
                [...pcStations.entries()]
                    .sort(([left], [right]) => left.localeCompare(right))
                    .forEach(([setId, components]) => {
                        const room = components.find(component => component.laboratoryRoom)?.laboratoryRoom;
                        select.add(new Option(room ? `${setId} — ${room}` : setId, setId));
                    });
                if (!pcStations.size) select.replaceChildren(new Option('No PC Stations found on your campus', ''));
            } catch(error) {
                select.replaceChildren(new Option(error.message || 'Failed to load PC stations.', ''));
            }
        }

        async function onPCStationSelect() {
            const setId = document.getElementById('pcStationSelect').value;
            if (!setId) {
                document.getElementById('pcSetScopePanel').style.display = 'none';
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            try {
                pcSetComponents = (pcStations.get(setId) || []).filter(component => component.status !== 'Missing');
                if (!pcSetComponents.length) throw new Error('No reportable components were found for this PC Station.');

                const compSelect = document.getElementById('pcComponentSelect');
                compSelect.replaceChildren(new Option('— Choose component —', ''));
                pcSetComponents.forEach(component => {
                    compSelect.add(new Option(`${component.name} — ${component.serialNumber || 'N/A'} (${component.category || 'Equipment'})`, component.equipmentId));
                });

                const entireList = document.getElementById('pcEntireList');
                entireList.replaceChildren(...pcSetComponents.map(component => {
                    const item = document.createElement('div');
                    item.textContent = `• ${component.name} — ${component.serialNumber || 'N/A'}`;
                    return item;
                }));

                document.getElementById('pcStationStatus').style.display = 'none';
                document.getElementById('pcSetScopePanel').style.display = '';

            } catch(error) {
                const status = document.getElementById('pcStationStatus');
                status.textContent = error.message || 'Failed to load components.';
                status.className = 'mt-2 text-xs text-red-400';
                status.style.display = '';
            }
        }

        function onPCSetScopeChange() {
            const selected = document.querySelector('input[name="pcSetScope"]:checked');
            if (!selected) return;

            document.getElementById('scopeCard1').classList.toggle('selected', selected.value === 'component');
            document.getElementById('scopeCard2').classList.toggle('selected', selected.value === 'entire');

            if (selected.value === 'component') {
                document.getElementById('pcComponentPicker').style.display = '';
                document.getElementById('pcEntireSummary').style.display = 'none';
                document.getElementById('submitBtn').disabled = !document.getElementById('pcComponentSelect').value;
            } else {
                document.getElementById('pcComponentPicker').style.display = 'none';
                document.getElementById('pcEntireSummary').style.display = '';
                document.getElementById('submitBtn').disabled = pcSetComponents.length === 0;
                currentEquipmentId = 'ENTIRE_SET:' + document.getElementById('pcStationSelect').value;
            }
        }

        function onPCComponentSelect() {
            currentEquipmentId = document.getElementById('pcComponentSelect').value;
            document.getElementById('submitBtn').disabled = !currentEquipmentId;
        }

        async function getEquipmentCatalog() {
            if (!equipmentCatalogRequest) {
                equipmentCatalogRequest = fetch('/api/student/equipment', { cache: 'no-store' })
                    .then(async response => {
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) {
                            throw new Error(data.error || `Unable to load equipment (${response.status}).`);
                        }
                        if (!Array.isArray(data)) {
                            throw new Error('Equipment search returned an invalid response.');
                        }
                        return data;
                    })
                    .catch(error => {
                        equipmentCatalogRequest = null;
                        throw error;
                    });
            }
            return equipmentCatalogRequest;
        }

        function hideEquipmentSuggestions() {
            const suggestions = document.getElementById('equipmentSuggestions');
            suggestions.style.display = 'none';
            suggestions.replaceChildren();
            document.getElementById('equipmentInput').setAttribute('aria-expanded', 'false');
            equipmentSuggestionIndex = -1;
        }

        function selectEquipmentSuggestion(equipmentId) {
            document.getElementById('equipmentInput').value = equipmentId;
            hideEquipmentSuggestions();
            searchEquipment();
        }

        async function showEquipmentSuggestions() {
            const input = document.getElementById('equipmentInput');
            const query = input.value.trim().toLocaleLowerCase();
            const suggestions = document.getElementById('equipmentSuggestions');
            equipmentValidationRequest += 1;
            currentEquipmentId = null;
            document.getElementById('equipmentInfo').style.display = 'none';
            document.getElementById('searchStatus').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            hideEquipmentSuggestions();
            if (!query) return;

            const loadingMessage = document.createElement('p');
            loadingMessage.className = 'px-3 py-2 text-xs text-slate-400';
            loadingMessage.textContent = 'Searching equipment...';
            suggestions.appendChild(loadingMessage);
            suggestions.style.display = '';
            input.setAttribute('aria-expanded', 'true');

            try {
                const equipment = await getEquipmentCatalog();
                if (input.value.trim().toLocaleLowerCase() !== query) return;

                const matches = equipment.filter(item => {
                    const equipmentId = String(item.equipmentId || '').toLocaleLowerCase();
                    return equipmentId.includes(query);
                }).slice(0, 8);

                suggestions.replaceChildren();
                if (!matches.length) {
                    const emptyMessage = document.createElement('p');
                    emptyMessage.className = 'px-3 py-2 text-xs text-slate-400';
                    emptyMessage.textContent = 'No matching equipment found.';
                    suggestions.appendChild(emptyMessage);
                } else {
                    matches.forEach(item => {
                        const option = document.createElement('button');
                        option.type = 'button';
                        option.className = 'equipment-suggestion';
                        option.setAttribute('role', 'option');
                        option.setAttribute('aria-selected', 'false');
                        option.dataset.equipmentId = item.equipmentId;

                        const name = document.createElement('span');
                        name.className = 'equipment-suggestion-name';
                        name.textContent = item.name || item.category || 'Equipment';
                        const id = document.createElement('span');
                        id.className = 'equipment-suggestion-id';
                        id.textContent = item.equipmentId;
                        option.append(name, id);
                        suggestions.appendChild(option);
                    });
                }
            } catch (error) {
                if (input.value.trim().toLocaleLowerCase() !== query) return;
                suggestions.replaceChildren();
                const errorMessage = document.createElement('p');
                errorMessage.className = 'px-3 py-2 text-xs text-red-400';
                errorMessage.textContent = error.message || 'Unable to search equipment.';
                suggestions.appendChild(errorMessage);
            }
        }

        async function searchEquipment() {
            const eqId = document.getElementById('equipmentInput').value.trim();
            if (!eqId) return;
            const requestId = ++equipmentValidationRequest;
            hideEquipmentSuggestions();

            const status = document.getElementById('searchStatus');
            status.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Searching...';
            status.style.display = '';
            status.className = 'mt-2 text-xs text-slate-400';

            document.getElementById('equipmentInfo').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;

            try {
                const res = await fetch(`/api/student/maintenance-context?equipmentId=${encodeURIComponent(eqId)}`);
                const data = await res.json().catch(() => ({}));
                if (requestId !== equipmentValidationRequest || document.getElementById('equipmentInput').value.trim() !== eqId) return;

                if (!res.ok || data.error) {
                    status.textContent = data.error || 'Equipment not found';
                    status.className = 'mt-2 text-xs text-red-400';
                    return;
                }

                const eq = data.equipmentMeta || {};
                document.getElementById('eqName').textContent = eq.name || eqId;
                document.getElementById('eqId').textContent = eq.equipmentId || eqId;
                document.getElementById('equipmentInfo').style.display = '';

                currentEquipmentId = eqId;

                if (!data.canSubmitReport) {
                    status.textContent = data.attendanceMessage || 'Not allowed to report';
                    status.className = 'mt-2 text-xs text-amber-400';
                    return;
                }

                status.textContent = data.attendanceMessage || 'Equipment verified';
                status.className = 'mt-2 text-xs text-emerald-400';
                document.getElementById('submitBtn').disabled = false;

            } catch(err) {
                if (requestId !== equipmentValidationRequest || document.getElementById('equipmentInput').value.trim() !== eqId) return;
                status.innerHTML = '<i class="fas fa-wifi mr-1"></i>Connection error';
                status.className = 'mt-2 text-xs text-red-400';
            }
        }

        async function submitReport() {
            const desc = document.getElementById('issueDescription').value.trim();
            if (!desc) {
                showStatus('Please describe the issue', 'error');
                return;
            }

            if (!currentEquipmentId) {
                showStatus('No equipment selected', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Submitting...';

            try {
                const category = document.getElementById('issueCategory').value;
                const isEntireSet = currentEquipmentId && currentEquipmentId.startsWith('ENTIRE_SET:');
                let successMessage = 'Your report was submitted. The campus technician can now review it.';
                let statusType = 'success';

                if (isEntireSet) {
                    let failedCount = 0;
                    let failedItems = [];
                    
                    for (const comp of pcSetComponents) {
                        try {
                            const res = await fetch('/api/maintenance', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({
                                    equipmentId: comp.equipmentId, 
                                    description: desc + ' (Entire PC Station reported)',
                                    category
                                })
                            });
                            
                            if (!res.ok) {
                                const errorData = await res.json().catch(() => ({}));
                                console.error('Failed to report', comp.name, errorData);
                                failedCount++;
                                failedItems.push(comp.name + ': ' + (errorData.error || 'Unknown error'));
                            }
                        } catch(err) {
                            console.error('Network error for', comp.name, err);
                            failedCount++;
                            failedItems.push(comp.name + ': Network error');
                        }
                    }

                    if (failedCount === pcSetComponents.length) {
                        throw new Error('All components failed to report:\n' + failedItems.join('\n'));
                    } else if (failedCount > 0) {
                        successMessage = `${pcSetComponents.length - failedCount} of ${pcSetComponents.length} component reports submitted. ${failedCount} failed: ${failedItems.join('; ')}`;
                        statusType = 'warning';
                    } else {
                        successMessage = `${pcSetComponents.length} component reports submitted successfully.`;
                    }

                    submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Reports Submitted';

                } else {
                    const res = await fetch('/api/maintenance', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            equipmentId: currentEquipmentId, 
                            description: desc,
                            category
                        })
                    });
                    
                    if (!res.ok) {
                        const errorData = await res.json().catch(() => ({}));
                        console.error('Submit error:', errorData);
                        throw new Error(errorData.error || 'Server returned error: ' + res.status);
                    }

                    const responseData = await res.json().catch(() => ({}));
                    console.log('Submit success:', responseData);

                    submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Report Submitted';
                }

                showStatus(successMessage, statusType);
            } catch(err) {
                console.error('Submit error:', err);
                const errorMsg = err.message || 'Unknown error occurred';
                showStatus(errorMsg, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Report';
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('submitStatus');
            el.textContent = msg;
            const statusStyles = {
                success: 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20',
                warning: 'bg-amber-500/10 text-amber-300 border border-amber-500/20',
                error: 'bg-red-500/10 text-red-400 border border-red-500/20'
            };
            el.className = 'mb-4 p-3 rounded-xl text-sm ' + (statusStyles[type] || statusStyles.error);
            el.style.display = '';
        }

        const equipmentInput = document.getElementById('equipmentInput');
        const equipmentSuggestions = document.getElementById('equipmentSuggestions');
        equipmentInput.addEventListener('input', showEquipmentSuggestions);
        equipmentSuggestions.addEventListener('click', event => {
            const option = event.target.closest('[data-equipment-id]');
            if (option) selectEquipmentSuggestion(option.dataset.equipmentId);
        });
        equipmentInput.addEventListener('keydown', event => {
            const options = [...equipmentSuggestions.querySelectorAll('[data-equipment-id]')];
            if (event.key === 'ArrowDown' && options.length) {
                event.preventDefault();
                equipmentSuggestionIndex = Math.min(equipmentSuggestionIndex + 1, options.length - 1);
                options[equipmentSuggestionIndex].focus();
            } else if (event.key === 'Enter') {
                event.preventDefault();
                if (equipmentSuggestionIndex >= 0 && options[equipmentSuggestionIndex]) {
                    selectEquipmentSuggestion(options[equipmentSuggestionIndex].dataset.equipmentId);
                } else {
                    searchEquipment();
                }
            } else if (event.key === 'Escape') {
                hideEquipmentSuggestions();
            }
        });
    </script>
    <script src="/js/student-sidebar-config.js?v=32" defer></script>
    <script src="/js/sidebar-component.js?v=79" defer></script>
</body>
